# 例外注册表 (CLAUDE.md §3.1 硬规则的集中例外清单)
#
# 来源决策: 文档体系检视 P1-01 (宪法绝对规则与已批准例外并存)
# 校验脚本: scripts/check_docs_consistency.py::check_exceptions_yaml_consistency()
# 契约测试: tests/unit/test_docs_consistency.py::TestExceptionsYamlConsistency
#
# 目的: 集中管理所有对硬规则 (红线 R1~R18 / §4 架构边界) 的已批准例外,
#       消除 KNOWN_EXCEPTIONS、技术债表、宪法各自维护独立例外的漂移风险。
#       (P1-01: KNOWN_EXCEPTIONS、技术债与宪法不得各自维护独立例外)
#
# 字段说明:
#   id: 例外稳定 ID (append-only, 格式 EX-XXXX, 不复用废弃编号)
#   rule_id: 被豁免的硬规则编号 (必须存在于 docs/governance/redlines.yml)
#   paths: 适用路径 (仓库相对路径, 必须真实存在)
#   reason: 例外原因 (为何允许偏离硬规则)
#   owner: 例外归属方 (负责维护该例外的团队/模块)
#   approved_by: 批准人/评审记录
#   expires_at | removal_trigger: 二选一, 例外到期时间或移除触发条件
#   verification: 如何验证该例外仍然成立 (自动检查或人工检查)
#
# 修改规则:
#   - 新增例外必须填写全部必填字段, 且 rule_id 必须存在于 redlines.yml
#   - 禁止删除或复用已废弃例外编号 (append-only)
#   - 例外到期或触发移除条件后, 必须从本文件移除并同步清理引用

# GDR-01 修复：补录契约 5 ignore_imports 现存 15 条 R1 例外（EX-0001~EX-0015），
# 使「例外唯一注册入口」名副其实；pyproject.toml 契约 5 注释逐条回指 EX id。
# 方向性违规（scheduler_service → strategies/services）按 review01-A2/A6 夜间预测下沉消除；
# 循环打破型（config.db ↔ db_config_service）随按域拆分迁移；关机/采集型 lazy import 保留但须带注释。
exceptions:
  # EX-0001: utils/config/db.py -> data.persistence.db_config_service（循环打破）
  - id: EX-0001
    rule_id: R1
    paths: ["utils/config/db.py"]
    reason: "config_handler ↔ db_config_service 循环打破。review05-E11 将 db 逻辑自 utils/config_handler 按域拆分迁至 utils/config/db.py，为保持现有单测 mock 有效，经 utils.config_handler 间接引用 data 层（函数内 lazy import 带 # lazy-import: 注释）。"
    owner: 架构维护者
    approved_by: 架构维护者（GDR-01 修复）
    removal_trigger: "随按域拆分完成 data 域归属迁移、utils/config/db.py 迁出 utils 层时移除（review05-E11 后续拆分计划锚点）。"
    verification: "lint-imports 契约 5 ignore_imports 守护（pyproject.toml 契约 5 注释回指 EX-0001）。"
  # EX-0002: utils/diagnostics.py -> data.data_processor（采集访问业务单例）
  - id: EX-0002
