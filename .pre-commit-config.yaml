repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: python -m ruff check --fix
        language: python
        additional_dependencies: ["ruff>=0.16.7"]
        types_or: [ python, pyi ]
        require_serial: true

      - id: ruff-format
        name: Ruff Format
        entry: python -m ruff format
        language: python
        additional_dependencies: ["ruff>=0.16.7"]
        types_or: [ python, pyi ]
        require_serial: true

      - id: type-ignore-reason
        name: Check type:ignore has reason (R3 review07-G5)
        entry: python scripts/check_type_ignore_reason.py
        language: system
        types_or: [ python, pyi ]

      - id: no-isolated-asyncio-testcase
        name: Check no IsolatedAsyncioTestCase usage
        entry: python scripts/check_no_isolated_asyncio.py
        language: system
        types_or: [ python, pyi ]
        pass_filenames: true
        exclude: ^scripts/check_no_isolated_asyncio\.py$

      - id: no-temp-files
        name: Block compiled/binary artifact files
        entry: python scripts/check_no_temp_files.py
        language: system
        pass_filenames: true
        # 不设置 types/types_or，确保所有文件类型都被检查。
        # 无扩展名文件不被拦截（见 scripts/check_no_temp_files.py 边界说明）。

      - id: pyright-changed
        name: Pyright Type Check (staged files)
        entry: python scripts/run_pyright_changed.py
        language: system
        types_or: [ python, pyi ]
        pass_filenames: true
        # 排除 alembic 迁移脚本（自动生成，类型注解宽松）与 scripts 自身（工具脚本，非业务代码）
        exclude: ^(alembic/|scripts/run_pyright_changed\.py$)

      - id: weak-assertion-changed
        name: Weak Assertion Scan (staged test files)
        entry: python scripts/check_staged_weak_assertions.py
        language: system
        types_or: [ python, pyi ]
        pass_filenames: true
        # 仅扫描 tests/ 下的 test_*.py（脚本内部已按文件名前缀过滤，files 是 pre-commit 层前置过滤）
        files: ^tests/.*test_.*\.py$

      - id: pip-compile-core
        name: pip-compile requirements.txt
        entry: uv pip compile --universal --no-emit-index-url pyproject.toml -o requirements.txt
        language: system
        files: ^(pyproject\.toml|requirements\.in)$
        pass_filenames: false

      - id: pip-compile-dev
        name: pip-compile requirements-dev.txt
        entry: uv pip compile --universal --no-emit-index-url --extra dev pyproject.toml -o requirements-dev.txt
        language: system
        files: ^(pyproject\.toml|requirements-dev\.in)$
        pass_filenames: false

      - id: pip-compile-optional
        name: pip-compile requirements-optional.txt
        entry: uv pip compile --universal --no-emit-index-url --extra optional pyproject.toml -o requirements-optional.txt
        language: system
        files: ^(pyproject\.toml|requirements-optional\.in)$
        pass_filenames: false

      - id: pip-compile-docs
        name: pip-compile requirements-docs.txt
        entry: uv pip compile --group docs --universal --no-emit-index-url -o requirements-docs.txt
        language: system
        # 纯文档工具链依赖组（检视 5.3）：源为 pyproject [dependency-groups].docs，无独立 .in 文件；
        # 输出再生成差异由 pre-commit「hook 修改文件即失败」机制拦截（与 core/dev/optional 同语义）。
        files: ^(pyproject\.toml|requirements-docs\.txt)$
        pass_filenames: false

      - id: verify-versions
        name: Verify and Fix Versions
        entry: python scripts/verify_versions.py --fix
        language: python
        # verify_versions.py 经 docs_markdown 统一解析视图校验文档（D5），hook 隔离环境
        # 须提供 docs 解析依赖组（脚本 docstring 正本要求；否则触发即 fail-closed）。
        additional_dependencies: ["markdown-it-py>=4.0.0", "pyyaml>=6.0.3"]
        files: ^(pyproject\.toml|\.release-please-manifest\.json|README\.md|CONTRIBUTING\.md|SECURITY\.md|CLAUDE\.md)$
        pass_filenames: false

      - id: docs-consistency
        name: Check docs consistency
        entry: python scripts/check_docs_consistency.py
        language: python
        # docs_markdown 统一解析视图（D3）依赖 markdown-it-py：hook 隔离环境必须自带该解析依赖，
        # 否则 hook 触发即 ModuleNotFoundError（与 verify-versions hook 同因）。
        additional_dependencies: ["pyyaml>=6.0", "markdown-it-py>=4.0.0"]
        # files 含 .py 以触发 NOTE(lazy) 三要素检查(任何 .py 变化都跑)；.ya?ml 覆盖治理正本 .yml 扩展名（GDR-02）。
        files: \.(md|toml|ya?ml|py)$
        pass_filenames: false

      - id: redline-check
        name: Redline automation check (R4/R9/R12/R13/R14/R15/R16 + R20/R21/R22 + UI bare colors)
        entry: python scripts/check_redlines.py
        language: system
        files: ^(core|data|services|strategies|utils|app|ui)/.*\.py$|^scripts/check_redlines\.py$|^scripts/prototype_business_redlines\.py$|^\.pre-commit-config\.yaml$
        pass_filenames: false

      - id: e2e-anchor-check
        name: E2E anchor reference check
        entry: python scripts/check_e2e_anchors.py
        language: system
        files: ^(ui|tests)/.*\.py$|^scripts/check_e2e_anchors\.py$|^\.pre-commit-config\.yaml$
        pass_filenames: false

      - id: theme-contrast-check
        name: WCAG theme contrast check
        entry: python scripts/check_theme_contrast.py
        language: system
        files: ^ui/theme\.py$|^scripts/check_theme_contrast\.py$
        pass_filenames: false

      - id: lint-imports
        name: Import Linter (R1 architecture guard)
        entry: lint-imports
        language: system
        pass_filenames: false
        files: ^(core|data|services|strategies|ui|app|utils)/|pyproject\.toml$
