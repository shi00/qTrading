# 纯文档测试独立配置（检视 5.3 / AC14）：与项目根 pytest 配置完全隔离。
# 运行方式（必须禁插件自动加载，并以 --confcutdir 截断向上 conftest 收集）：
#   $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
#   python -m pytest -c tests/docs/pytest.ini --confcutdir=tests/docs tests/docs -q
[pytest]
# 显式空 addopts：不继承项目根的 -n auto / --timeout / --strict-markers 等业务选项
# （插件未自动加载时这些选项会让收集直接失败，见检视 6.4「依赖/测试」负例）。
addopts =
testpaths = .
markers =
    docs_pure: 纯文档测试（仅依赖 docs 组与标准库，不加载业务夹具/插件）
