# FinBERT GGUF 微调产线 workflow（CG-3，ADR-0012 修订经 ADR-0013 承载）。
#
# 产线链路：workflow_dispatch（model_version 可选 + corpus_tag + force_retrain）→
# 指纹路由（ADR-0015 内容寻址：对语料 sums + 产线脚本白名单 + workflow + 基座
# revision + llama.cpp commit 计算 canonical 指纹，与最新 finbert-gguf-v* Release
# 随附 fingerprint.json 对比——输入无变化即拒绝重训，省 1~3h 无效训练；版本留空
# 自动 minor+1）→ 临时安装训练依赖
# （torch CPU / transformers，仅离线训练使用，不进 pyproject 运行时依赖）→
# 下载基座模型（HF Hub 固定 revision）+ 语料 Release（SHA256 全量校验 + 语料 manifest
# 校验——行数/digest 期望值取自 manifest，缺失/不兼容即报错，FT-07；另作 F2 语料锚
# 断言：实际下载的 SHA256SUMS.txt 必须与指纹锚一致）→
# 固定 seed 训练（scripts/train_finbert.py）→ 拆头导出 GGUF
# （scripts/export_finbert_gguf.py，llama.cpp 工具链 v0.3.0 @ c1d0e7a0——tag 别名见下，
# f16 即发布产物——Q8_0 量化因概率差判据必 FAIL 已于 2026-10-14 移除，
# 定因见 export 脚本 docstring）→ pre-tokenizer 登记补丁
# （scripts/patch_llama_cpp_pre_registry.py，FinBERT2-base chkhsh 上游未登记）→
# 一致性 Gate（scripts/verify_finbert_gguf.py --head，N0-3 四判据）→
# 上传排障 artifact（无论 Gate 成败）与发布 artifact（仅 Gate 通过后，含
# fingerprint.json 供下轮训练作去重基线）→
# 发布 job 复验 SHA256 后发布 Release `finbert-gguf-v{model_version}`
#（note 含训练语料 corpus_tag 及其 SHA256、训练指纹，模型↔语料 lineage 溯源）。
#
# 最小权限拆分（FT-06）：训练/导出/Gate job（train-export-gate）全链路
# 仅 contents: read——依赖安装 / 语料下载 / 训练 / 导出 / Gate 期间 job
# token 不具备写仓库能力；发布 job（publish-release）单独授予
# contents: write，仅消费已上传的发布 artifact（下载后 sha256sum -c
# 复验再发布），不 checkout、不执行仓库脚本。
#
# 与主 CI（ci_cd.yml）隔离：
# - 本 workflow 仅 workflow_dispatch 触发（无 push / PR / schedule 触发器）；
# - concurrency 固定分组 `finbert-train` 且 cancel-in-progress: false
#   （训练 1~3h，不可被同组新 run 中断）；
# - 发布 tag 形如 `finbert-gguf-v0.1.0`，前缀 `finbert-gguf-` 不以 `v` 开头，
#   天然不匹配主 CI push 触发器的 `v*.*.*` tag 过滤，不会误触发 build-windows。
#
# llama.cpp 工具链获取路径（2026-10-14 查证固化）：llama.cpp v0.3.0 GitHub Release
# 无 ubuntu 预编译包（assets 仅 nightly-tag.txt，GitHub API 实证），故走 fallback——
# checkout commit c1d0e7a004015f23bc0233470b747b596f29b264（tag v0.3.0 指向的提交，
# 对齐结论与证据链见 scripts/export_finbert_gguf.py 模块 docstring）；
# convert_hf_to_gguf.py 为纯 Python 脚本直接使用 checkout 内文件，其 gguf 依赖以
# 同源 llama.cpp/gguf-py 安装，避免 PyPI 版本漂移。f16 交付后不再需要
# llama-quantize 二进制（无 cmake 编译步骤）。
#
# 依赖与环境基线（FT-08）：训练依赖全部精确 pin（==，含 accelerate/numpy/
# sentencepiece，考证依据见安装步骤注释），范围约束与 bare 包名会随 PyPI 漂移、
# 引入训练数值行为差异。PyPI 不允许同版本重传，"name==version" 本身即不可变锚点，
# 故不另建 requirements lock / wheel hash 清单——训练依赖不进 pyproject，独立 lock
# 会与 workflow 双份维护并引入两份 pin 漂移（升级须整组重训验证后同步更新，见安装
# 步骤注释）。工具链同理：由 tag 改为 commit 锚定（tag 可被上游移动/重打，commit
# 不可变），实际 commit 写入 Release note lineage。runner 保持滚动基线 ubuntu-latest
# （固定 container 需自维护镜像并改造 gh CLI 依赖，收益仅锁 glibc 等系统库——torch
# CPU wheel 静态内嵌数学内核，不链接系统 BLAS，数值影响路径几乎不存在，权衡后不采用），
# 代价由 Release note 环境段兜底：ImageOS/ImageVersion（当日 runner 镜像，
# runner-images 预置）/ Python / 显式 pin 依赖版本 / 已安装环境全量依赖清单 + SHA256
# 摘要（覆盖显式 pin 之外的传递依赖）逐 run 如实记录，跨次训练行为差异可归因
#（见 Generate release note）。

name: FinBERT GGUF Train Pipeline

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: '模型版本号（纯数字 semver；留空则自动取最新 Release minor+1 并探测 tag 空位；发布 tag 为 finbert-gguf-v<model_version>）'
        required: false
        type: string
      corpus_tag:
        description: '训练语料 Release tag（写入 Release note 作模型↔语料 lineage）'
        required: true
        default: 'corpus-v1'
        type: string
      force_retrain:
        description: '强制重训（训练指纹与最新 Release 一致时仍继续训练；指纹路由默认拒绝输入无变化的重复训练）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: finbert-train
  cancel-in-progress: false

jobs:
  # job1：训练 / 导出 / Gate（FT-06 最小权限拆分）。全链路（依赖安装 /
  # llama.cpp 工具链 / 语料下载 / 训练 / 导出 / Gate / 产物整理）仅需
  # contents: read——语料下载（gh release download）读 Release asset 亦
  # 只需读权限；发布写权限单独收敛到 publish-release job。
  train-export-gate:
    name: Train / Export / Gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      # 训练全链路只读：任一前置步骤被恶意/攻陷代码控制时，job token
      # 暴露期间也不具备写仓库内容 / Release 的能力（FT-06）。
      contents: read
    outputs:
      # 跨 job 传递发布所需参数（model_version / release_tag 由指纹路由步骤产出；
      # validate_inputs 仅产出 corpus_tag）。
      model_version: ${{ steps.fingerprint_route.outputs.model_version }}
      release_tag: ${{ steps.fingerprint_route.outputs.release_tag }}
    env:
      # ubuntu runner 4 核：训练（--num-threads 4）与 llama.cpp 推理线程数对齐，
      # 避免超线程互踩。
      TORCH_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      # 语料下载走 gh CLI（github.token 只读即可，无需 PAT）
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate dispatch inputs (model_version semver, anti tag-injection)
        id: validate_inputs
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
          CORPUS_TAG: ${{ inputs.corpus_tag }}
        run: |
          set -euo pipefail
          # model_version 可选（ADR-0015）：留空由指纹路由步骤自动 minor+1；
          # 仅在非空时校验 semver 形态。
          if [ -n "$MODEL_VERSION" ] && ! [[ "$MODEL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::model_version 必须为纯数字 semver（如 0.2.0）或留空（自动 minor+1），实际: $MODEL_VERSION" >&2
            exit 1
          fi
          if ! [[ "$CORPUS_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::corpus_tag 含非法字符，实际: $CORPUS_TAG" >&2
            exit 1
          fi
          echo "corpus_tag=$CORPUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 指纹路由（ADR-0015 内容寻址发布）：对训练输入（语料 SHA256SUMS.txt +
      # 产线脚本白名单 5+1 自举 + workflow 全文 + 基座 revision + llama.cpp commit，
      # 后两者从 workflow 文本 fail-safe 提取）计算 canonical JSON 指纹，与最新
      # finbert-gguf-v* Release 随附的 fingerprint.json 对比：
      # - 无历史 Release / 锚点无指纹资产 / spec 不兼容 → 放行（INCOMPARABLE）；
      # - 指纹一致且未勾选 force_retrain → exit 1 拒绝（输入无变化，省 1~3h 重训）；
      # - 指纹不同 → 放行并打印分量级 diff。
      # 版本解析：显式 model_version 原样使用（对应 Release tag 已存在时秒拒，
      # FT-05 fail-fast）；留空自动取 semver 最新 tag minor+1 并循环探测 tag 空位。
      # 步骤落点：置于装依赖**之前**——路由拒绝时无需安装训练依赖（fail-fast）；
      # 脚本 stdlib 运行（F3 复用链传递依赖的 utils/core 模块当前亦全 stdlib，
      # 引入三方依赖时路由即 fail-closed，方向安全），runner 预置 python3 即可
      # 运行（四支柱与 runner 镜像豁免见 scripts/compute_training_fingerprint.py
      # docstring）。
      - name: Fingerprint route (compute_training_fingerprint.py, ADR-0015)
        id: fingerprint_route
        env:
          CORPUS_TAG: ${{ steps.validate_inputs.outputs.corpus_tag }}
          INPUT_MODEL_VERSION: ${{ inputs.model_version }}
          FORCE_RETRAIN: ${{ inputs.force_retrain }}
        run: |
          set -euo pipefail
          ARGS=(route --corpus-tag "$CORPUS_TAG" --repo "$GITHUB_REPOSITORY" --output stage_a_out/fingerprint.json)
          if [ -n "$INPUT_MODEL_VERSION" ]; then ARGS+=(--model-version "$INPUT_MODEL_VERSION"); fi
          if [ "$FORCE_RETRAIN" = "true" ]; then ARGS+=(--force-retrain); fi
          python3 scripts/compute_training_fingerprint.py "${ARGS[@]}"

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      # 训练依赖（ADR-0012 修订经 ADR-0013 承载：不进 pyproject，仅 workflow 临时安装）。
      # torch 用 CPU wheel（--index-url download.pytorch.org/whl/cpu）避免 CUDA 巨包；
      # 版本考证：transformers==5.19.0 为离线训练实物版本（scripts/train_finbert.py
      # docstring），其 requires torch>=2.5，torch 取 CPU index 版本 2.9.1（2026-10 锁定；
      # 该索引此后已发布更高版本，"取最新"不再是可维持的表述，升级须整组重训验证后
      # 同步更新 pin 与注释）；
      # Trainer 依赖 accelerate（transformers 的 extra，不随主包装），须显式安装。
      # 全 pin（FT-08）：accelerate/numpy/sentencepiece 以 CI 实证组合锚定
      # （finbert-train 成功 run 38530387711 于 2026-10-14 实际安装版本，训练+
      # 导出+Gate 全链路通过），PyPI 元数据交叉验证：transformers 5.19.0 要求
      # accelerate>=1.1.0 / sentencepiece!=0.1.92,>=0.1.91 / numpy>=1.17，
      # accelerate 1.15.0 要求 torch>=2.0.0 / numpy>=1.17，torch 2.9.1 不设
      # numpy 版本上限（torch 2.x 原生支持 numpy 2.x）——均满足。范围约束
      # （如 accelerate>=1.1.0）与 bare 包名会随 PyPI 新版本漂移，引入训练数值
      # 行为差异（聚合精度/默认参数），使跨次训练 lineage 比较失真，故全部
      # 精确 pin；升级时须整组重训验证后同步更新 pin 与注释。
      - name: Install training / export / gate dependencies
        run: |
          set -euo pipefail
          pip install --no-cache-dir "torch==2.9.1" \
            --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir \
            "transformers==5.19.0" \
            "accelerate==1.15.0" \
            "numpy==2.5.4" \
            "sentencepiece==0.2.2" \
            "llama-cpp-python==0.3.35"

      # llama.cpp 工具链：checkout commit（tag v0.3.0 指向的提交，2026-08-25）——tag 可被
      # 上游移动/重打，commit 不可变（FT-08 由 tag 改为 commit 锚定；该 sha 同步写入
      # Release note lineage，防「记录 tag、实际拉取被移动后的提交」静默漂移）。对齐
      # llama-cpp-python 0.3.35 vendor，查证证据链见 scripts/export_finbert_gguf.py docstring。
      - name: Checkout llama.cpp v0.3.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          # v0.3.0 指向的 commit（不可变锚点，sha 与 note lineage 经静态断言绑定）
          ref: c1d0e7a004015f23bc0233470b747b596f29b264
          path: llama.cpp
          persist-credentials: false

      # convert_hf_to_gguf.py import gguf：以同源 llama.cpp/gguf-py 安装（而非 PyPI
      # gguf），保证 GGUF 写出端与工具链同版本。
      - name: Install gguf-py (from llama.cpp checkout)
        run: |
          set -euo pipefail
          pip install --no-cache-dir ./llama.cpp/gguf-py

      # FinBERT2-base（vocab=21128）的 BPE pre-tokenizer chkhsh 在上游 llama.cpp
      # 全版本未登记（v0.3.0~v0.6.0 实证），convert_hf_to_gguf.py 会直接
      # NotImplementedError；运行时（llama-cpp-python）对 BERT 分类器始终外部分词，
      # pre 名仅为元数据 → 注入已识别的 bert-bge-large 登记项（幂等，详见脚本 docstring）。
      - name: Patch llama.cpp pre-tokenizer registry (FinBERT2-base chkhsh)
        run: |
          set -euo pipefail
          python scripts/patch_llama_cpp_pre_registry.py \
            --base-file llama.cpp/conversion/base.py

      # 基座模型（HF Hub 公开可得，2026-10-14 实证：valuesimplex-ai-lab/FinBERT2-base
      # gated=false，Apache-2.0；本地产物 ai_models/FinBERT2-base/config.json 与
      # reviews/新闻达标模型微调.md §15.2 同源）。固定 revision 为当前 HF sha，
      # 保证可复现；升级基座时同步更新此 hash 与 release note。
      - name: Download base model (HF Hub pinned revision)
        env:
          FINBERT_BASE_REPO: valuesimplex-ai-lab/FinBERT2-base
          FINBERT_BASE_REVISION: 804a488abcece861e9241d55e9d6fd1f867ebee1
        run: |
          set -euo pipefail
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["FINBERT_BASE_REPO"],
              revision=os.environ["FINBERT_BASE_REVISION"],
              local_dir="ai_models/FinBERT2-base",
          )
          print("基座模型已下载至 ai_models/FinBERT2-base")
          EOF

      # 语料：gh release download + SHA256 全量校验 + manifest 校验（FT-07）。
      # manifest（corpus_manifest.json）为行数 / digest 期望值的唯一权威来源，替代原先固定在
      # 本 workflow 内的硬编码行数期望值，使任意带 manifest 的 corpus tag 可用（多版本共存）。
      # manifest 缺失或
      # 不兼容时脚本清晰报错：未登记 tag 无 manifest 即 FAIL（不静默回退硬编码）。legacy
      # 兜底（corpus-v1 已发布、无 manifest）显式登记于 scripts/corpus_manifest.py 的
      # LEGACY_CORPUS_REGISTRY，走该路径时报告与 Release note 显式声明「未做 manifest 校验」
      #（R21：不得把未校验伪装成已校验）。行数口径 = 非空行，与
      # scripts/train_finbert.load_split_file 的空行跳过对齐。
      - name: Download training corpus (Release) and verify integrity
        env:
          CORPUS_TAG: ${{ steps.validate_inputs.outputs.corpus_tag }}
        run: |
          set -euo pipefail
          gh release download "$CORPUS_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir data/corpus --clobber
          (cd data/corpus && sha256sum -c SHA256SUMS.txt)
          # F2 语料锚断言（ADR-0015）：实际下载的 SHA256SUMS.txt 必须与指纹锚一致——
          # 防 corpus Release 资产在「路由步骤下载」与「语料下载」之间被替换导致
          # 指纹与训练输入错位；错位即 fail-fast。
          python scripts/compute_training_fingerprint.py verify-corpus-anchor \
            --fingerprint stage_a_out/fingerprint.json \
            --corpus-sums data/corpus/SHA256SUMS.txt
          python scripts/corpus_manifest.py verify \
            --corpus-dir data/corpus \
            --corpus-tag "$CORPUS_TAG" \
            --report stage_b_out/corpus_manifest_report.json

      # 固定 seed 训练（reviews §5.2 超参固化在脚本内，seed=DEFAULT_SEED 20261008；
      # ubuntu runner 4 核 → --num-threads 4）。
      - name: Train FinBERT (train_finbert.py)
        run: |
          set -euo pipefail
          python scripts/train_finbert.py \
            --corpus-dir data/corpus \
            --model-dir ai_models/FinBERT2-base \
            --out-dir stage_b_out \
            --seed 20261008 \
            --num-threads 4

      # 拆头导出：head.npz + 编码器 f16 GGUF（发布产物，工具路径按 --llama-cpp-repo 布局推导）。
      - name: Export GGUF (export_finbert_gguf.py)
        run: |
          set -euo pipefail
          python scripts/export_finbert_gguf.py \
            --model-dir stage_b_out/best \
            --out-dir stage_b_out \
            --llama-cpp-repo llama.cpp \
            --out-prefix finbert2-news

      # 一致性 Gate（N0-3 四判据：分词一致 / CLS 余弦 / 概率差<0.02 / 标签一致率≥99%）。
      # 发布产物为 f16（f16-only，可选 q8 对照件不使用）；参考模型为训练产物 best
      #（微调后编码器）；--head 使用训练好的分类头。
      # 退出码 0=PASS / 1=FAIL；FAIL 时本步骤失败 → 发布 artifact 上传与
      # 发布 job（publish-release）均不执行。
      - name: Consistency gate (verify_finbert_gguf.py --head)
        id: gate
        run: |
          set -euo pipefail
          python scripts/verify_finbert_gguf.py \
            --reference-model stage_b_out/best \
            --f16-gguf stage_b_out/finbert2-news-f16.gguf \
            --head stage_b_out/head.npz \
            --report stage_b_out/finbert2-news-f16.verify.json

      # 效果硬门槛（FT-02）：与**最近一次已发布 Release**（tag `finbert-gguf-v*`，按
      # semver 降序取最新）的 dev/test macro-F1 比较——主门槛 `test macro-F1 >= 锚点
      # test macro-F1 - 0.03`，dev 下限护栏 `dev macro-F1 >= 锚点 dev macro-F1 - 0.03`，
      # 任一低于「锚点值 - 0.03」即 FAIL。容差 0.03 出处：reviews/新闻达标模型微调.md
      # §5.2「阶段 B 在 400 条测试集上的 macro-F1 比阶段 A 高 >= 3 个百分点」判据
      # （语义=允许的噪声回退上限）。锚点数值**运行期从该 Release note 解析**，禁止在
      # 本 workflow / 脚本中硬编码。判定为纯 Python 函数（scripts/verify_finbert_effect_gate.py，
      # 可单测），失败时退出码非零。
      # 锚点不可得三态（R21，不得把「已知不可比」伪装成「已达标」）：① 有历史 Release 但
      # note 指标缺失/不可解析，或锚点查询失败（gh 不可用/网络故障）→ FAIL（fail-closed，
      # 不可归因不得放行）；② 确无历史 Release（首版）→ 不阻断，判定 NO_BASELINE 并在
      # Release note 显式声明「无基线可比，未施加效果门槛」；③ 本次自身指标缺失/NaN/非有限
      # → FAIL。
      # 闸门落点（发布路径，不可绕过）：本步骤在 job1（train-export-gate，只读权限）内，
      # FAIL → job1 失败 → publish-release（needs + if success）跳过 → Release 不产生；
      # 不放进 publish-release job 以免绕过 job1 的失败判定。
      - name: Effect gate (verify_finbert_effect_gate.py)
        id: effect_gate
        env:
          EFFECT_GATE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/verify_finbert_effect_gate.py \
            --train-summary stage_b_out/best/train_summary.json \
            --repo "$EFFECT_GATE_REPO" \
            --report stage_b_out/effect_gate.json

      # 产物 SHA256 清单（发布资产自校验凭证）。fingerprint.json（ADR-0015 指纹）
      # 随发布资产一并发布：下轮训练以它为对比基线（内容寻址去重的锚）——cp 自
      # 路由步骤产出的 stage_a_out。
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cp stage_a_out/fingerprint.json stage_b_out/fingerprint.json
          cd stage_b_out
          sha256sum finbert2-news-f16.gguf head.npz fingerprint.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Release note：模型 ↔ 语料 lineage 溯源（corpus_tag + 语料 SHA256）。
      # 生成逻辑全用 Python 变量（不用 Actions 表达式嵌入字符串，避免 ${{ }} 误展开）。
      # 环境段（FT-08）：训练环境（runner 镜像 ImageOS/ImageVersion）/ Python /
      # 依赖版本（显式 pin 取自已安装 metadata，与 pip pin 单一事实源；另附已安装
      # 环境全量清单 + SHA256 摘要，覆盖显式 pin 之外的传递依赖）/ llama.cpp 工具链
      # commit（与 checkout ref 单一事实源，静态断言绑定）逐 run 如实记录，跨次训练
      # 行为差异可归因——滚动 runner（ubuntu-latest）基线决策见文件头注释与 PR 说明。
      - name: Generate release note
        env:
          MODEL_VERSION: ${{ steps.fingerprint_route.outputs.model_version }}
          CORPUS_TAG: ${{ steps.validate_inputs.outputs.corpus_tag }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import hashlib
          import importlib.util
          import json
          import os
          import platform
          import sys
          from importlib.metadata import PackageNotFoundError
          from importlib.metadata import distributions
          from importlib.metadata import version as pkg_version
          from pathlib import Path

          model_version = os.environ["MODEL_VERSION"]
          corpus_tag = os.environ["CORPUS_TAG"]
          repo_full = os.environ["GITHUB_REPOSITORY"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo_full}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          # FT-08 环境 lineage（可复现性）：依赖版本自已安装环境动态读取（与上方
          # pip install pin 单一事实源，防双份硬编码漂移）；读不到即 fail-fast——
          # 缺版本号的 note 不应发布（训练 1~3h 后失败可接受，胜过 lineage 失真）。
          lineage_packages = (
              "torch",
              "transformers",
              "accelerate",
              "numpy",
              "sentencepiece",
              "llama-cpp-python",
          )
          try:
              dep_versions = " / ".join(f"{name} {pkg_version(name)}" for name in lineage_packages)
          except PackageNotFoundError as exc:
              raise SystemExit(f"训练依赖 metadata 读取失败，release note lineage 不完整，拒绝发布: {exc}")
          # 完整依赖清单（FT-08）：显式 pin 之外的传递依赖（tokenizers / safetensors /
          # huggingface-hub / gguf-py 等）随 PyPI 解析与本地路径安装可能变化，仅记录
          # 显式 pin 会留下无归因依据的静默漂移窗口。清单直接取自已安装环境实况
          # （importlib.metadata.distributions()，非第二份手写列表），排序后拼接为
          # 规范文本并给出 SHA256 摘要——两次训练环境是否一致可据此直接比对。
          env_inventory = []
          for dist in distributions():
              dist_name = dist.metadata["Name"]
              if dist_name and dist.version:
                  env_inventory.append(f"{dist_name}=={dist.version}")
          env_inventory.sort(key=str.lower)
          env_inventory_text = "\n".join(env_inventory)
          env_inventory_digest = hashlib.sha256(env_inventory_text.encode("utf-8")).hexdigest()
          # runner 镜像预置变量（actions/runner-images images/ubuntu/scripts/build/
          # configure-environment.sh 写入 etc-environment）；缺失时显性记录 unknown，
          # 不阻断训练——跨次训练行为差异可据此归因到当日 runner 镜像。
          image_os = os.environ.get("ImageOS", "unknown")
          image_version = os.environ.get("ImageVersion", "unknown")
          # 等价 python --version 输出（如 3.13.9），记录当日 setup-python 实际解析版本。
          python_version = platform.python_version()

          # 语料 lineage（FT-07）：行数 / digest 取自语料 manifest 校验报告
          # （stage_b_out/corpus_manifest_report.json，上一步产出），为唯一事实源——note 不再
          # 另算行数或另读 SHA256SUMS.txt（避免双份事实源漂移）。缺失即 fail-fast，不发布
          # lineage 不完整的 note。legacy 语料（无 manifest）在 note 中显式声明「未做 manifest
          # 校验」（R21：不得把未校验伪装成已校验）。
          corpus_report_path = Path("stage_b_out/corpus_manifest_report.json")
          if not corpus_report_path.is_file():
              raise SystemExit("corpus_manifest_report.json 缺失，语料 manifest lineage 不完整，拒绝发布")
          corpus_report = json.loads(corpus_report_path.read_text(encoding="utf-8"))
          corpus_splits = corpus_report["splits"]
          corpus_lines = "\n".join(
              f"  - `{name}`: `{item['actual_sha256']}`（{item['actual_rows']} 行）"
              for name, item in corpus_splits.items()
          )
          corpus_rows_expr = " + ".join(str(item["actual_rows"]) for item in corpus_splits.values())
          corpus_total = corpus_report["total_rows"]
          if corpus_report["manifest_state"] == "manifest":
              manifest_lineage = (
                  f"已按 manifest 声明校验行数/digest（schema `{corpus_report['manifest_schema']}`，"
                  f"corpus_version `{corpus_report['manifest_version']}`，corpus_tag `{corpus_report['corpus_tag']}`）"
              )
          else:
              manifest_lineage = (
                  "⚠️ 该语料 **无 manifest**，采用显式登记值（legacy registry），**未做 manifest 校验**；"
                  "新增语料版本必须随附 corpus_manifest.json"
              )

          summary = json.loads(Path("stage_b_out/best/train_summary.json").read_text(encoding="utf-8"))

          # FT-02 效果门槛 lineage：读取 Effect gate 步骤产出的 effect_gate.json，把门槛口径
          # （公式 + 容差出处）、锚点 Release tag、锚点 dev/test、本次 dev/test、判定结论
          # （PASS / NO_BASELINE）全部写入 note。FAIL 时本步骤不可达（job1 已在 Effect gate
          # 步骤失败、不会生成 note 也不会发布），故此处只记录 PASS / NO_BASELINE；文件缺失
          # 即 fail-fast，不发布 lineage 不完整的 note。
          effect_path = Path("stage_b_out/effect_gate.json")
          if not effect_path.is_file():
              raise SystemExit("effect_gate.json 缺失，效果门槛 lineage 不完整，拒绝发布")
          effect = json.loads(effect_path.read_text(encoding="utf-8"))

          def _metric(value):
              return "无" if value is None else repr(value)

          anchor_tag = effect.get("anchor_tag")
          if effect["verdict"] == "NO_BASELINE":
              effect_verdict = "无基线可比（无历史 Release）——未施加效果门槛"
          else:
              effect_verdict = str(effect["verdict"])

          effect_lines = [
              "## 效果门槛（FT-02）",
              "",
              f"- **门槛口径**: `test macro-F1 >= 锚点 test macro-F1 - {effect['tolerance']}` 且 "
              f"`dev macro-F1 >= 锚点 dev macro-F1 - {effect['tolerance']}`"
              f"（容差出处：{effect['tolerance_source']}）",
              f"- **锚点 Release**: {'`' + anchor_tag + '`' if anchor_tag else '无（首版，无基线可比）'}",
              f"- **锚点 dev/test macro-F1**: {_metric(effect.get('baseline_dev_macro_f1'))} / "
              f"{_metric(effect.get('baseline_test_macro_f1'))}",
              f"- **本次 dev/test macro-F1**: {_metric(effect.get('current_dev_macro_f1'))} / "
              f"{_metric(effect.get('current_test_macro_f1'))}",
              f"- **判定**: **{effect_verdict}**",
          ]
          if effect.get("reasons"):
              effect_lines.append(f"- **说明**: {'; '.join(effect['reasons'])}")
          effect_section = "\n".join(effect_lines) + "\n\n"

          # ADR-0015 训练指纹 lineage：读取路由步骤产出、随发布资产发布的
          # fingerprint.json，给出指纹总 SHA256（canonical components 口径——
          # 哈希实现经 import 复用 compute_training_fingerprint.py，单一事实源）。
          # 缺失即 fail-fast，不发布 lineage 不完整的 note。
          fingerprint_path = Path("stage_b_out/fingerprint.json")
          if not fingerprint_path.is_file():
              raise SystemExit("fingerprint.json 缺失，训练指纹 lineage 不完整，拒绝发布")
          fingerprint = json.loads(fingerprint_path.read_text(encoding="utf-8"))
          _fp_spec = importlib.util.spec_from_file_location(
              "compute_training_fingerprint", "scripts/compute_training_fingerprint.py"
          )
          if _fp_spec is None or _fp_spec.loader is None:
              raise SystemExit("compute_training_fingerprint.py 无法加载，指纹 lineage 不完整，拒绝发布")
          _fp_mod = importlib.util.module_from_spec(_fp_spec)
          sys.modules.setdefault("compute_training_fingerprint", _fp_mod)
          _fp_spec.loader.exec_module(_fp_mod)
          fingerprint_sha = _fp_mod.fingerprint_sha256(fingerprint["components"])

          note = (
              f"# FinBERT GGUF 模型 finbert-gguf-v{model_version}\n"
              "\n"
              f"- **model_version**: {model_version}\n"
              f"- **训练语料**: `{corpus_tag}`（[Release](https://github.com/{repo_full}/releases/tag/{corpus_tag})，模型↔语料 lineage 溯源）\n"
              "- **语料 SHA256**（corpus Release 内 SHA256SUMS.txt / manifest 声明）:\n"
              f"{corpus_lines}\n"
              f"- **行数守恒**: {corpus_rows_expr} = {corpus_total} ✅\n"
              f"- **语料 manifest（FT-07）**: {manifest_lineage}\n"
              f"- **训练指纹（ADR-0015）**: spec `{fingerprint.get('fingerprint_spec')}`，SHA256 `{fingerprint_sha}`"
              "（资产 fingerprint.json；canonical components 口径，与最新 Release 指纹一致的重跑会被路由拒绝）\n"
              "- **基座模型**: valuesimplex-ai-lab/FinBERT2-base @ 804a488abcece861e9241d55e9d6fd1f867ebee1（HF Hub，Apache-2.0）\n"
              f"- **训练 seed**: {summary['seed']}（scripts/train_finbert.py DEFAULT_SEED）\n"
              "- **llama.cpp 工具链**: v0.3.0 @ c1d0e7a004015f23bc0233470b747b596f29b264"
              "（tag v0.3.0 指向的 commit，已 commit 锚定；对齐 llama-cpp-python 0.3.35，"
              "见 scripts/export_finbert_gguf.py docstring）\n"
              f"- **训练环境**: GitHub Actions ubuntu-latest CPU（ImageOS={image_os}, ImageVersion={image_version}）\n"
              f"- **Python**: {python_version}\n"
              f"- **显式 pin 训练依赖**: {dep_versions}\n"
              f"- **完整依赖清单**: {len(env_inventory)} 项，SHA256 `{env_inventory_digest}`"
              "（已安装环境全量，含传递依赖；两次训练该摘要不一致即环境漂移）\n"
              "<details><summary>展开完整依赖清单</summary>\n"
              "\n"
              "```\n"
              f"{env_inventory_text}\n"
              "```\n"
              "\n"
              "</details>\n"
              f"- **dev macro-F1**: {summary.get('best_dev_macro_f1')} / **test macro-F1**: {summary.get('test_macro_f1')}\n"
              "\n"
              "## 产物\n"
              "\n"
              "| 文件 | 用途 |\n"
              "|------|------|\n"
              "| `finbert2-news-f16.gguf` | 发布用 f16 编码器（llama-cpp-python 加载；f16 交付定因见 scripts/export_finbert_gguf.py docstring） |\n"
              "| `head.npz` | 分类头（mode=bert：cw/cb/pw/pb，reviews §8.2 格式；labels = [利空, 中性, 利好]） |\n"
              "| `fingerprint.json` | 训练指纹（ADR-0015 内容寻址；下轮训练以此为去重基线） |\n"
              "| `SHA256SUMS.txt` | 上述三文件 SHA256 自校验凭证 |\n"
              "\n"
              "## 一致性 Gate\n"
              "\n"
              "N0-3 四判据（scripts/verify_finbert_gguf.py --head）：分词一致 / CLS 余弦 /\n"
              f"概率差<0.02 / 标签一致率≥99% —— 已通过（训练流水线 run：{run_url}）。\n"
              "\n"
              f"{effect_section}"
              "## 边界声明\n"
              "\n"
              "本模型仅用于 App 内新闻情绪打分展示（ADR-0008 / ADR-0013「仅展示边界」），\n"
              "不构成投资建议。\n"
          )
          # 写入 stage_b_out 与发布产物同目录：发布 artifact 四文件同源时
          # upload-artifact 以 stage_b_out 为根平铺，发布 job 下载后
          # sha256sum -c 的相对路径与 SHA256SUMS.txt 直接对齐。
          Path("stage_b_out/release_note.md").write_text(note, encoding="utf-8")
          print("stage_b_out/release_note.md 已生成")
          EOF
          cat stage_b_out/release_note.md

      # 发布 artifact（Gate 通过后才会执行到这里）：仅含发布所需最小文件集，
      # 由 publish-release job 下载复验后发布。文件同在 stage_b_out，
      # artifact 根为 stage_b_out（平铺），下载侧与 SHA256SUMS.txt 相对路径
      # 一致；if-no-files-found: error 保证文件缺失时上传即失败（fail-safe）。
      # 排障 artifact（见文末）单独上传：两者命名与用途互不混用。
      - name: Upload release artifacts (for publish job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: finbert-gguf-release-${{ steps.fingerprint_route.outputs.model_version }}-${{ github.run_id }}
          path: |
            stage_b_out/finbert2-news-f16.gguf
            stage_b_out/head.npz
            stage_b_out/SHA256SUMS.txt
            stage_b_out/fingerprint.json
            stage_b_out/release_note.md
          if-no-files-found: error
          retention-days: 7

      # 无论 Gate 成败上传产物（训练摘要 / 导出产物 / verify 报告），便于排障。
      # 与上方发布 artifact 分开上传：本步骤 if: always() 且含 verify.json 等
      # 排障文件；发布 artifact 仅 Gate 通过后上传，仅含发布最小文件集。
      - name: Upload artifacts (incl. gate-failure debugging)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: finbert-gguf-${{ steps.fingerprint_route.outputs.model_version }}-${{ github.run_id }}
          path: |
            stage_a_out/fingerprint.json
            stage_b_out/best/train_summary.json
            stage_b_out/best/best_f1.txt
            stage_b_out/best/test_macro_f1.txt
            stage_b_out/head.npz
            stage_b_out/finbert2-news-f16.gguf
            stage_b_out/finbert2-news-f16.verify.json
            stage_b_out/effect_gate.json
            stage_b_out/corpus_manifest_report.json
          if-no-files-found: warn
          retention-days: 7

  # job2：发布 Release（FT-06 最小权限拆分）。仅此 job 授予 contents: write；
  # 不 checkout 仓库、不执行仓库脚本——只消费 job1 上传的发布 artifact：
  # 下载 → sha256sum -c 本地复验 → gh release view（已存在即拒绝覆盖并失败，
  # FT-05 版本不可变）/ create。Gate 失败时 job1 结果非 success → 本 job 跳过，
  # 不会以未校验产物发布。
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [train-export-gate]
    if: needs.train-export-gate.result == 'success'
    permissions:
      # 仅发布 Release（gh release create / upload）需要 contents: write。
      contents: write
    env:
      # Release 操作走 gh CLI（github.token 即可，无需 PAT）
      GH_TOKEN: ${{ github.token }}
    steps:
      # 按 name 精确下载（artifact 不存在时本步骤直接失败，fail-safe）；
      # v8 传输层默认校验服务端 digest（mismatch 即 error），下载后再做本地
      # sha256sum 复验（发布资产自校验凭证），构成双重完整性保障。
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: finbert-gguf-release-${{ needs.train-export-gate.outputs.model_version }}-${{ github.run_id }}
          path: release-assets

      # 发布前复验：job1 生成的 SHA256SUMS.txt（相对文件名）与 artifact
      # 平铺根对齐；release_note.md 不在清单内，单独断言存在。
      - name: Verify checksums before publish
        run: |
          set -euo pipefail
          test -f release-assets/release_note.md
          cd release-assets
          sha256sum -c SHA256SUMS.txt

      # Gate 已通过（job 级 if 保证），此处直接发布。
      # 同 tag 重跑拒绝覆盖（FT-05）：model_version 为不可变发布标识，Release
      # （tag）已存在时拒绝发布并失败——--clobber 部分更新（只换资产二进制、
      # 不换 note）会使 lineage（note ↔ 资产 digest ↔ 运行参数）静默错位；
      # 新结果必须提升 model_version 后以新 tag 发布（note 本就按版本生成）。
      # 若首次发布中断（tag 已建而资产不完整），须人工删除该 Release 并留痕
      # 后重跑（错误信息中有指引）。
      # tag `finbert-gguf-v*` 不以 v 开头，不匹配主 CI `v*.*.*` 过滤（见文件头注释）。
      - name: Publish release (finbert-gguf-v*)
        env:
          RELEASE_TAG: ${{ needs.train-export-gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          ASSETS=(
            release-assets/finbert2-news-f16.gguf
            release-assets/head.npz
            release-assets/SHA256SUMS.txt
            release-assets/fingerprint.json
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$RELEASE_TAG 已存在（同 model_version 已发布）——拒绝覆盖，请提升 model_version 后重跑；若系首次发布中断致资产不完整，请人工删除该 Release（留痕）后重跑" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "finbert-gguf-v${{ needs.train-export-gate.outputs.model_version }}" \
            --notes-file release-assets/release_note.md \
            --target "$GITHUB_SHA"
