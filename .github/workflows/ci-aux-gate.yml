name: CI Aux Gate

# 独立补偿检查的稳定 PR / merge_group 门禁：
# - 聚合 job `CI Aux Gate` 是可供 ruleset 注册的 required check：`pull_request` 不设 paths
#   过滤，保证每次 PR 都出现；`merge_group` 同样声明，启用 merge queue 后合成提交也能拿到该 check。
# - `detect` job 按变更路径决定是否执行的补偿检查；需要时通过 workflow_call 调用
#   `sidecar.yml` / `precommit-config-ci.yml`，不需要时对应调用 job 明确 skipped。
# - 聚合判定只放行「需要 → success」「不需要 → skipped」两种组合；其它（failure / cancelled /
#   非预期 skipped / detect 失败）一律失败，避免「上游失败 → 下游跳过 → 门禁绿灯」。
# - 本 workflow 不修改远端 ruleset：`CI Aux Gate` 需由授权维护者在 main 的
#   `main-required-checks` 中注册为 required 后才成为强制检查。
on:
  pull_request:
    branches: [ "main" ]
    # 不使用 paths 过滤：required check 必须每次 PR 都出现。
  merge_group:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # merge_group 事件下 github.head_ref 为空，回落到 github.ref；队列 ref 含 PR 号与 SHA，天然唯一。
  # 与 sidecar / precommit 的 concurrency group 前缀不同，避免相互取消。
  group: ci-aux-gate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 变更探测：决定两个补偿检查是否执行。选择器对 rename 的新旧路径取并集
  # （PR 用 filename + previous_filename，merge_group 用 --no-renames 的删除 + 新增两行）。
  # fork PR / API 失败 / 触达 3000 文件上限 / merge_group 取不到 diff / 未知事件一律两者 true
  # （fail-closed），保证不会因探测失败而少跑检查。
  detect:
    name: Detect auxiliary changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sidecar: ${{ steps.detect.outputs.sidecar }}
      precommit: ${{ steps.detect.outputs.precommit }}

    steps:
      - name: Checkout pull request commit
        # PR 事件的变更列表走 API，但选择逻辑在 scripts/classify_aux_changed_paths.py，
        # 需要工作区脚本；只取当前提交，不拉全量历史。
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout merge group commits
        # merge_group 需要 base / head 两个提交对象才能做 git diff。
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect affected auxiliary checks
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub 的默认 bash 带 -e；这里显式关闭，以便把 API / git 失败转为 fail-closed 的
          # 「两者都跑」，而不是让探测 job 直接失败后进入聚合判定。
          set +e
          set -uo pipefail

          sidecar=false
          precommit=false

          run_both() {
            echo "sidecar=true" >> "$GITHUB_OUTPUT"
            echo "precommit=true" >> "$GITHUB_OUTPUT"
            echo "- $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          classify_file() {
            local files="$1" result
            # 选择逻辑在 scripts/classify_aux_changed_paths.py：每行取 filename 与
            # previous_filename 两列的并集后再匹配，rename 的新旧两端都参与选择。
            if ! result="$(python scripts/classify_aux_changed_paths.py < "$files")"; then
              run_both "辅助变更选择器执行失败，运行全部补偿检查（fail-closed）"
            fi
            sidecar="$(printf '%s\n' "$result" | sed -n 's/^sidecar=//p')"
            precommit="$(printf '%s\n' "$result" | sed -n 's/^precommit=//p')"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              run_both "workflow_dispatch：无法反推 PR 变更，运行全部补偿检查（fail-closed）"
              ;;
            pull_request)
              files="$(mktemp)"
              # 每个 API 条目输出一行两列（filename<TAB>previous_filename）。GitHub 对
              # 重命名只在 filename 给新路径、previous_filename 给旧路径；两列都保留后交给
              # 选择器取并集。行数仍等于 API 条目数，3000 上限计数口径不变。
              if ! gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$files"; then
                rm -f "$files"
                run_both "PR 变更文件 API 读取失败（fork / 权限 / 网络），运行全部补偿检查（fail-closed）"
              fi
              count="$(grep -c . "$files" || true)"
              if [ "$count" -ge 3000 ]; then
                rm -f "$files"
                run_both "变更文件数 $count 达到 API 分页上限 3000，运行全部补偿检查（fail-closed）"
              fi
              classify_file "$files"
              rm -f "$files"
              ;;
            merge_group)
              if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
                run_both "merge_group 缺少 base/head SHA，运行全部补偿检查（fail-closed）"
              fi
              files="$(mktemp)"
              # --no-renames 把重命名拆成「删除旧路径 + 新增新路径」两行，新旧两端都保留；
              # git 本地 diff 没有 API 分页上限，无需 3000 判断。
              if ! git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$files"; then
                rm -f "$files"
                run_both "merge_group git diff 失败，运行全部补偿检查（fail-closed）"
              fi
              classify_file "$files"
              rm -f "$files"
              ;;
            *)
              run_both "未知事件 $EVENT_NAME，运行全部补偿检查（fail-closed）"
              ;;
          esac

          echo "sidecar=$sidecar" >> "$GITHUB_OUTPUT"
          echo "precommit=$precommit" >> "$GITHUB_OUTPUT"
          echo "- 事件 \`$EVENT_NAME\`：sidecar=$sidecar，precommit=$precommit" >> "$GITHUB_STEP_SUMMARY"

  # 独立必达元检查（检视 D22）：对真实 workflow 做静态 + 语义解析，验证
  # docs-ci.yml 的 job 图、测试文件选择、执行条件与错误传播，并断言本 job 自身
  # 已接入下面的聚合判定。不做路径过滤、不 depends detect：每次事件都运行，避免
  # 「只改 workflow → 主分类器 code=false → 合同测试未被选中」时选择被改成 echo
  # 仍保持绿色。
  ci-meta-contract:
    name: "Auxiliary check: CI meta contract"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install --quiet 'pyyaml>=6'

      - name: Run CI meta contract check
        run: python scripts/check_ci_meta_contract.py

  sidecar-check:
    name: "Auxiliary check: qtrading-pg-sidecar"
    needs: detect
    if: needs.detect.outputs.sidecar == 'true'
    # GitHub 在调用期校验每个 nested job 的权限不得超过调用方上限：sidecar.yml 的
    # publish-release job 请求 contents: write，故调用方必须授予 write，否则整个 workflow
    # 直接 startup_failure。写权限只可能被 publish-release 使用，而它仅在 tag push 运行、
    # PR/merge_group 均被其 if 跳过；sidecar 顶层与其余 job 仍为 contents: read。
    permissions:
      contents: write
    uses: ./.github/workflows/sidecar.yml

  precommit-check:
    name: "Auxiliary check: pre-commit config"
    needs: detect
    if: needs.detect.outputs.precommit == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/precommit-config-ci.yml

  # 稳定聚合 check 名称：`CI Aux Gate`。显式校验 needs 结果，不用「skipped 即通过」的默认语义。
  ci-aux-gate:
    name: CI Aux Gate
    needs: [detect, ci-meta-contract, sidecar-check, precommit-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Evaluate auxiliary checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT: ${{ needs.detect.result }}
          META_RESULT: ${{ needs.ci-meta-contract.result }}
          SIDECAR_REQUESTED: ${{ needs.detect.outputs.sidecar }}
          SIDECAR_RESULT: ${{ needs.sidecar-check.result }}
          PRECOMMIT_REQUESTED: ${{ needs.detect.outputs.precommit }}
          PRECOMMIT_RESULT: ${{ needs.precommit-check.result }}
        run: |
          set -euo pipefail
          fail=0
          {
            echo "## CI Aux Gate"
            echo ""
            echo "事件 \`${EVENT_NAME}\`，变更探测 \`${DETECT}\`"
            echo ""
            echo "| 检查 | 需要 | 结果 | 判定 |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DETECT" != "success" ]; then
            echo "| detect | - | ${DETECT:-missing} | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi

          # 元检查无条件必达：success 之外的任何结果（failure / cancelled / skipped）均判失败。
          if [ "$META_RESULT" != "success" ]; then
            echo "| ci-meta-contract | - | ${META_RESULT:-missing} | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi

          check_aux() {
            local name="$1" requested="$2" result="$3"
            if [ "$requested" = "true" ] && [ "$result" = "success" ]; then
              echo "| $name | yes | $result | ok |" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            if [ "$requested" = "false" ] && [ "$result" = "skipped" ]; then
              echo "| $name | no | $result | ok（按改动跳过） |" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            echo "| $name | ${requested:-unknown} | ${result:-unknown} | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          # detect 失败时 outputs 为空，上面的 detect 行已判失败；此处不再对空值重复判定。
          if [ "$DETECT" = "success" ]; then
            check_aux "sidecar" "$SIDECAR_REQUESTED" "$SIDECAR_RESULT" || fail=1
            check_aux "precommit" "$PRECOMMIT_REQUESTED" "$PRECOMMIT_RESULT" || fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**CI Aux Gate 不通过**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI Aux Gate 不通过：补偿检查缺失、失败或被非预期跳过（详见 step summary）"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**CI Aux Gate 通过**" >> "$GITHUB_STEP_SUMMARY"
