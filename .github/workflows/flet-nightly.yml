name: Flet Nightly Compatibility Check

on:
  schedule:
    # 每天凌晨 3:00 UTC（北京时间 11:00），错开主 CI flaky 检测（2:00 UTC）1 小时
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CI_PG_PASSWORD: ${{ secrets.CI_PG_PASSWORD }}

concurrency:
  group: flet-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flet-compatibility-check:
    name: Flet Nightly Compatibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.CI_PG_PASSWORD }}
          POSTGRES_DB: test_astock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify CI_PG_PASSWORD secret
        env:
          CI_PG_PASSWORD: ${{ env.CI_PG_PASSWORD }}
        run: |
          if [ -z "$CI_PG_PASSWORD" ]; then
            echo "::error::CI_PG_PASSWORD secret is not configured. Please add it in repository settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt
          # Pre-install flet-web to prevent the Flet runtime from auto-installing it at app startup.
          # Same fix as embedded-tests job (ci_cd.yml): without this, Linux E2E fails because
          # Flet tries to pip install flet-web at runtime into system Python without a venv.
          # Constrain fastapi<0.145: flet-web 1.0.5 passes the removed `openapi_prefix` to
          # FastAPI.__init__; fastapi 0.145.0+ crashes Flet Web startup. See
          # docs/flet/upgrade-checklist.md section 1.1.
          uv pip install --system flet-web==1.0.5 "fastapi<0.145"
          pip install playwright pytest-playwright

      - name: Install Playwright chromium
        run: playwright install --with-deps chromium

      - name: Install Rust toolchain (1.97.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: sidecars/qtrading-pg-sidecar
          key: flet-nightly-${{ hashFiles('sidecars/qtrading-pg-sidecar/.cargo/config.toml') }}

      - name: Build sidecar binary from source
        shell: bash
        env:
          # postgresql_embedded build script 通过 GitHub API 下载 PostgreSQL binaries 清单，
          # 未认证请求 60 次/小时/IP，传入 GITHUB_TOKEN 提升至 5000 次/小时（对齐 embedded-tests job）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecars/qtrading-pg-sidecar
          cargo build --release
          BINARY_PATH="target/release/qtrading-pg-sidecar"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: sidecar binary not found at $BINARY_PATH after cargo build"
            exit 1
          fi
          ABSOLUTE_PATH="$(pwd)/$BINARY_PATH"
          echo "SIDECAR_BINARY_PATH=$ABSOLUTE_PATH" >> $GITHUB_ENV
          HASH=$(sha256sum "$BINARY_PATH" | awk '{print $1}')
          echo "SIDECAR_SHA256=$HASH" >> $GITHUB_ENV
          echo "Sidecar binary built: $ABSOLUTE_PATH (sha256: $HASH)"

      - name: Run contract tests (anchor unit + screener anchor smoke)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ env.CI_PG_PASSWORD }}@localhost:5432/test_astock
          E2E_BROWSER_CHANNEL: chromium
          QTRADING_DATABASE_MODE: embedded
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
          E2E_TIMEOUT_MULTIPLIER: "2.0"
        run: |
          python -m pytest tests/unit/ui/test_anchor.py tests/e2e/test_screener_anchor_smoke.py -v --tb=short

      - name: Run anchor E2E (navigation)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ env.CI_PG_PASSWORD }}@localhost:5432/test_astock
          E2E_BROWSER_CHANNEL: chromium
          QTRADING_DATABASE_MODE: embedded
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
          E2E_TIMEOUT_MULTIPLIER: "2.0"
        run: |
          python -m pytest tests/e2e/test_navigation.py -v --tb=short

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 去重键 = 稳定标题（不含 runId）：持续故障只保留一个待办 Issue，后续 run 追加评论。
            // 本 workflow 只有一个失败信号（唯一 job flet-compatibility-check 的 failure()），
            // 故单一标题即可区分失败类别；若将来拆出多个 job / 多个失败类别，必须把类别并入标题，
            // 否则不同类别会被错误地合并到同一 Issue。
            const STABLE_TITLE = 'Flet nightly compatibility check failed';
            // 去重键只用标题、不叠加 label：仓库未保证预置专用 label，向 create 传未知 label
            // 可能被忽略或报错，会使去重键静默失效；本 workflow 只有一个失败信号，稳定标题足以唯一标识。
            // 兼容历史标题 `... failed (<runId>)`：旧逻辑按 run 建单留下的 open Issue 仍能命中，
            // 无需人工收口；新逻辑一律创建并匹配不带 runId 的稳定标题。
            const TITLE_PATTERN = /^Flet nightly compatibility check failed( \(\d+\))?$/;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // 从 pyproject.toml 读取 pinned flet 版本
            const fs = require('fs');
            let fletVersion = 'unknown';
            try {
              const pyproject = fs.readFileSync('pyproject.toml', 'utf8');
              const match = pyproject.match(/["']flet==([^"']+)["']/);
              if (match) {
                fletVersion = match[1];
              }
            } catch (error) {
              core.warning(`Cannot read pinned flet version from pyproject.toml: ${error.message}`);
            }
            const runLine = `- Run: ${runUrl} (trigger: \`${context.eventName}\`, commit: \`${context.sha}\`, pinned: \`flet==${fletVersion}\`)`;
            try {
              // 分页遍历全部 open issue（issues 接口会返回 PR，必须排除）；
              // 不能只取第一页 100 条，否则 open issue 超过 100 时去重失效。
              const openIssues = await github.paginate(
                github.rest.issues.listForRepo.endpoint.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100
                })
              );
              const found = openIssues.find(
                issue => !issue.pull_request && TITLE_PATTERN.test(issue.title)
              );
              // 只对 open Issue 去重：Issue 被人工关闭后再次失败按新建处理，保留人工关闭语义（不自动重开）。
              if (found) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: found.number,
                  body: `Another nightly run failed:\n\n${runLine}\n\nSee the run log for which step failed.`
                });
                core.info(`Appended run record to existing issue: ${found.html_url}`);
                return;
              }
              const body = `## Flet Nightly Compatibility Check Failed

            **Workflow run**: ${runUrl}
            **Triggered by**: ${context.eventName}
            **Commit**: ${context.sha}
            **Flet version**: \`flet==${fletVersion}\` (pinned in \`pyproject.toml\`)

            ### Failed steps
            Check the workflow run logs for details on which step failed.

            ### Context
            This nightly job runs contract tests (anchor unit + screener anchor smoke) and one anchor E2E (navigation) to guard Flet compatibility before minor/patch upgrade candidates arrive.

            ### Subsequent failures
            Later nightly runs failing for the same reason are appended to this issue as comments instead of opening new issues. If this issue is closed, the next failing run opens a new one.
            `;
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: STABLE_TITLE,
                body: body
              });
              core.info(`Created issue: ${created.data.html_url}`);
            } catch (error) {
              // 建单是排障辅助动作：失败不得改变 workflow 结论，但必须留痕（不得静默吞掉）。
              core.warning(`Failed to create/update nightly failure issue: ${error.message}`);
            }
