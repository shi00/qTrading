name: Pre-commit Config CI

# 仅修改 `.pre-commit-config.yaml` 的 PR 不触发主 CI（ci_cd.yml 的 pull_request.paths 不含该文件），
# hook entry、独立环境依赖或文件选择规则的缺陷会延迟到 main push 才暴露。
# 不把该文件加入主 CI 白名单：那会让单文件配置 PR 拉起整套主流水线（PG service、迁移往返、
# 单测/集成、Windows E2E/embedded），而这些覆盖对配置改动零增量。
# 本 workflow 只做 hook 侧的等价验证，不含 PG service / 迁移 / 测试，也不与主 CI 重复触发
# （`.pre-commit-config.yaml` 不在 ci_cd.yml paths 内）。
#
# `pre-commit validate-config` 只校验 schema 与 files/exclude 正则合法性，entry 指向不存在的
# 命令等缺陷只有在真正执行 hook 时才暴露，故必须在合并前跑 `pre-commit run --all-files`。
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '.pre-commit-config.yaml'
      - '.github/workflows/precommit-config-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-precommit-config-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  precommit-config-smoke:
    name: Pre-commit Config Smoke
    runs-on: ubuntu-latest
    # 15 分钟预算：本 workflow 首次真实运行（run 40653567480）含依赖安装 + 全量 hooks 共 2 分 32 秒，
    # 留约 6 倍余量应对冷缓存；超时即失败暴露，不放大到主 CI 量级。
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      # 依赖集合与 ci-checks 对齐（含 optional 的 playwright）：pyrightconfig.json 的
      # reportMissingImports=error，缺包会让 pyright-changed hook 全量扫描时误报而非真实缺陷。
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Validate pre-commit config
        run: pre-commit validate-config .pre-commit-config.yaml

      - name: Run all pre-commit hooks
        run: pre-commit run --all-files
