name: AStockScreener CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    # 不使用 paths 过滤：main 的 required status check 是聚合门禁 CI Gate，
    # 若 paths 未命中则本 workflow 根本不触发，该 check 永久停在 Pending 并阻塞合并。
    # 变更是否属于代码类由 Changes job（scripts/classify_changed_paths.py）在运行时判定，
    # 非代码 PR 只跑轻量 job，重型 job 跳过（见各 job 的 needs / if）。
  merge_group:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # 每天凌晨 2:00 UTC（北京时间 10:00）运行 flaky 检测
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  CI_PG_PASSWORD: ${{ secrets.CI_PG_PASSWORD }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 变更分类：判断本次 PR 是否触及代码类路径，决定重型 job 是否执行。
  # 非 PR 事件、fork PR、API/脚本异常一律 code=true（fail-closed），保证不会因分类失败而漏跑验证。
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "- 事件 \`$EVENT_NAME\`：非 PR，按代码变更处理" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "- fork PR：无法可靠分类，按代码变更处理（fail-closed）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          count="$(printf '%s\n' "$files" | grep -c . || true)"
          if [ "$count" -ge 3000 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "- 变更文件数 $count 达到 API 分页上限 3000，按代码变更处理（fail-closed）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          result="$(printf '%s\n' "$files" | python scripts/classify_changed_paths.py)"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "- 变更文件数 $count，分类结果 \`$result\`" >> "$GITHUB_STEP_SUMMARY"

  # 稳定基线 lint（Python 3.14，默认运行时）：聚合门禁 CI Gate 只依赖本 job，结果语义确定。
  lint-fast:
    name: Fast Lint Check (3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff==0.16.7

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

  # 兼容性 lint（Python 3.13，声明下界 requires-python>=3.13）：D8.1 起 3.14 为主矩阵，
  # 3.13 仅保留本 job 守护最低支持版本（ruff 静态检查不依赖解释器版本，故一个 job 足够）。
  # 独立成 job 而非 lint-fast 的 matrix 项：CI Gate 只依赖 needs.lint-fast.result，
  # 两代解释器的 lint 结果各自独立上报，避免 matrix 合并状态带来的判定歧义。
  lint-fast-313:
    name: Fast Lint Check (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff==0.16.7

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

  # 静态门禁（自原 ci-checks 拆出）：pre-commit / 版本一致性 / pip-audit / pyright / 弱断言扫描。
  # 这些步骤不依赖 PostgreSQL service，也与下方单测/集成测试无先后依赖，独立成 job 可并行，
  # 把 Linux 侧关键路径从「静态 + DB + 测试串行」压到最长分支。
  ci-checks-static:
    name: Code Quality (Linux, Python ${{ matrix.python-version }})
    needs: [lint-fast, changes]
    # 跳过条件与下方 ci-checks 一致：dependabot / fork PR 无 secrets、非代码类 PR 跳过重型 job。
    if: needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # 禁用 setup-uv 自带缓存（默认键绑定 uv.lock，本仓库以 requirements*.txt 为准且未跟踪
          # uv.lock），改由下方 actions/cache 显式缓存 UV_CACHE_DIR（对齐 Windows 侧已验证方案）。
          enable-cache: false

      - name: Cache uv build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/uv-cache
          # 键不含 ref：requirements 未变时 main 与各 PR 共用同一条目（同键写入去重，不产生每 PR
          # 副本）；变更 requirements 的 PR 会额外存一份，由 cache-prune.yml 按「非 main 且 3 天
          # 未访问」清理，10 GB 预算口径见 docs/guides/ci-cd.md「缓存治理」。
          key: uv-linux-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-linux-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt
          pip install pyright==1.1.414

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Cache ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('**/*.py') }}
          restore-keys: ruff-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Verify Version Consistency
        run: python scripts/verify_versions.py

      - name: Security Audit (pip-audit)
        run: |
          python scripts/run_pip_audit.py \
            --requirements requirements.txt requirements-optional.txt requirements-dev.txt \
            --allowlist .security/audit-allowlist.yml \
            --sources pypi

      - name: Pyright Type Check
        continue-on-error: false
        run: pyright

      - name: Scan weak assertions (incremental gate)
        run: python scripts/scan_weak_assertions.py --path tests/ --base tests/weak_assertion_baseline.json

  # DB 迁移门禁（自原 ci-checks 拆出）：只需要 PostgreSQL service，与静态检查、单测无依赖。
  ci-checks-db:
    name: DB Migration Checks (Linux)
    needs: [lint-fast, changes]
    if: needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.CI_PG_PASSWORD }}
          POSTGRES_DB: test_astock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify CI_PG_PASSWORD secret
        env:
          CI_PG_PASSWORD: ${{ env.CI_PG_PASSWORD }}
        run: |
          if [ -z "$CI_PG_PASSWORD" ]; then
            echo "::error::CI_PG_PASSWORD secret is not configured. Please add it in repository settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: Cache uv build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/uv-cache
          key: uv-linux-py3.14-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-linux-py3.14-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt

      - name: Verify Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ env.CI_PG_PASSWORD }}@localhost:5432/test_astock
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Verify ORM-Migration Schema Consistency
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: ${{ env.CI_PG_PASSWORD }}
        run: python -m pytest tests/integration/test_orm_migration_consistency.py -v --tb=long

  # 测试门禁（原 ci-checks 剩余部分）：单测 + 集成测试 + 覆盖率/差异覆盖率 + SBOM。
  # 静态检查与 DB 迁移校验已拆到 ci-checks-static / ci-checks-db 并行执行，
  # Linux 侧关键路径由「静态 + DB + 测试串行」变为最长分支（见 docs/guides/ci-cd.md「CI Job 矩阵」）。
  ci-checks:
    name: Unit & Integration Tests (Linux, Python ${{ matrix.python-version }})
    needs: [lint-fast, changes]
    # Dependabot 发起的 PR 与普通 fork PR 均不被注入仓库 secrets（GitHub Actions 平台安全限制，仅提供只读 GITHUB_TOKEN）。
    # 本 job 依赖 CI_PG_PASSWORD（postgres 服务容器 + integration 测试）与 CODECOV_TOKEN，
    # secret 为空会导致 postgres 容器在 service 初始化阶段启动失败（见 run 31780083379）；service 先于步骤启动，
    # 下方 "Verify CI_PG_PASSWORD" 步骤无法提前拦截，且 R10 禁止硬编码 fallback 密码。
    # 故两种情况均跳过本 job（跳过显示为 skipped，不冒充通过）：fork PR 的 Linux 质量验证由维护者审阅后
    # 以在库分支重跑再合并（受控路径）；Dependabot 侧为 actions 依赖升级，与业务测试无关。
    # 非 PR 事件（push / tag / merge_group / workflow_dispatch）pull_request 上下文为空，条件按事件名放行。
    # changes.outputs.code：非代码类 PR（仅文档等）跳过重型套件；非 PR 事件由 changes job 输出 true。
    if: needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.CI_PG_PASSWORD }}
          POSTGRES_DB: test_astock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # diff-coverage 需真实 merge-base：默认 fetch-depth=1 浅克隆使三点 diff 退化两点，
          # 误把 main 侧并发改动计入本分支变更行，导致 diff-coverage 误报（review 流水线问题）。
          # 完整历史（fetch-depth: 0）保证 `git merge-base origin/main HEAD` 可算。
          fetch-depth: 0

      - name: Verify CI_PG_PASSWORD secret
        env:
          CI_PG_PASSWORD: ${{ env.CI_PG_PASSWORD }}
        run: |
          if [ -z "$CI_PG_PASSWORD" ]; then
            echo "::error::CI_PG_PASSWORD secret is not configured. Please add it in repository settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # 禁用 setup-uv 自带缓存：其默认缓存键绑定 uv.lock，本仓库以 requirements*.txt 为准
          # 且未跟踪 uv.lock（实测每次 Install dependencies 都在重新下载 ~300 MB wheel，耗时 2~3 分钟）；
          # 改由下方 actions/cache 显式缓存 UV_CACHE_DIR（对齐全仓 Windows 侧已验证方案）。
          enable-cache: false

      - name: Cache uv build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/uv-cache
          # 键不含 ref：requirements 未变时 main 与各 PR 共用同一条目（actions/cache 对同键写入去重，
          # 不产生每 PR 副本）；requirements 变更的 PR 会额外存一份，由 cache-prune.yml 按
          # 「非 refs/heads/main 且 3 天未访问」清理，10 GB 预算口径见 docs/guides/ci-cd.md「缓存治理」。
          key: uv-linux-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-linux-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt

      - name: Cache pytest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: pytest-${{ runner.os }}-

      - name: Run Unit Tests
        env:
          STRICT_SCHEMA_GATE: "1"
        run: |
          set -e
          python -m pytest tests/unit/ -v --tb=short --cov --cov-report=term-missing --cov-report=xml --cov-report=json --junitxml=junit-unit.xml

      - name: Run Integration Tests
        timeout-minutes: 10
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: ${{ env.CI_PG_PASSWORD }}
          DATABASE_URL: postgresql+asyncpg://postgres:${{ env.CI_PG_PASSWORD }}@localhost:5432/test_astock
        run: |
          set -e
          # Diagnose xdist worker hang: thread method dumps all thread stacks to stderr on timeout.
          # --max-worker-restart=0 prevents xdist from masking the deadlock by restarting workers.
          # --capture=no ensures faulthandler.dump_traceback() output reaches GitHub Actions logs.
          # step-level timeout-minutes=10 fails fast if thread method can't interrupt (e.g., C extension deadlock).
          python -m pytest tests/integration/ -n auto --max-worker-restart=0 \
            --timeout=120 --timeout-method=thread \
            -v --tb=long --capture=no \
            --cov --cov-report=term-missing --cov-append --junitxml=junit-integration.xml

      - name: Check Per-File Coverage >= 80%
        run: python scripts/check_per_file_coverage.py

      - name: Report Layered Coverage (review07-G14, advisory)
        run: python scripts/check_per_file_coverage.py --report

      - name: Check diff coverage
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          BASE="${BASE:-main}"
          git fetch --depth=1 origin "$BASE" 2>/dev/null || true
          python scripts/check_diff_coverage.py --base "origin/$BASE" --strict --threshold 80

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            junit-*.xml
          retention-days: 14

      - name: Generate SBOM
        if: always()
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-ci-checks.cdx.json
          # 禁用 release asset 上传：ci-checks job 仅持有 contents: read 权限，
          # 默认 upload-release-assets: true 在 tag 推送时会尝试把 SBOM 附加到
          # 对应 GitHub Release（需 contents: write），导致 "Resource not
          # accessible by integration" 错误（run 30244639291/job/89908947183）。
          # 发布产物的 SBOM 由 build-windows job 生成并经 release-windows job 上传。
          upload-release-assets: false

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-ci-checks-${{ matrix.python-version }}
          path: sbom-ci-checks.cdx.json
          retention-days: 7

  e2e-tests-windows:
    name: E2E Tests (Windows)
    needs: [lint-fast, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # 依赖安装缓存：uv 构建缓存重定向到 D:（146GB），避免占用 C:；
    # 由下方 actions/cache 显式缓存（setup-uv 自带缓存与磁盘清理步骤冲突）。
    env:
      UV_CACHE_DIR: D:\tmp\uv-cache
    # 性能优化：拆成 5 个 matrix 组并行，按会话池分组，让每个 job 只懒实例化本组需要的
    # session 池（ro / mut / wizard / embedded_real_* / fullmount / news_risk_*），
    # 避免单 job 串行初始化全部 8 个 sidecar + PG 池。
    # job 名保持不变：CI Gate 用 needs.e2e-tests-windows.result 聚合矩阵结果，
    # 不需要改 ci-gate / build-windows 的 needs。
    # 分组必须保持同一文件的用例顺序（settings_flow → settings_tabs 的配置副作用、
    # r01_dialog_height 依赖 news_risk_success 种子池），因此以文件为最小粒度。
    # core 组按实测单文件耗时对半拆为 core-a / core-b（run 41034285982 的 junit：
    # screener_flow 182s、data_explorer 59s、backtest_flow 37s、screener_anchor_smoke 30s、
    # screener_to_backtest 23s、navigation 18s、task_center 13s、smoke 8s、home_flow 8s，
    # 总计 402s；原单腿 627s 是 PR 关键路径上的最长分支）。scenarios 组不可再拆：
    # r01_dialog_height 依赖同组 test_news_risk 播下的 news_risk_success 种子池。
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-a
            paths: >-
              tests/e2e/test_screener_flow.py
              tests/e2e/test_screener_anchor_smoke.py
              tests/e2e/test_task_center.py
              tests/e2e/test_smoke.py
          - group: core-b
            paths: >-
              tests/e2e/test_backtest_flow.py
              tests/e2e/test_data_explorer.py
              tests/e2e/test_home_flow.py
              tests/e2e/test_navigation.py
              tests/e2e/test_screener_to_backtest.py
          - group: settings
            paths: >-
              tests/e2e/test_settings_flow.py
              tests/e2e/test_settings_tabs.py
          - group: onboarding
            paths: >-
              tests/e2e/test_onboarding_embedded.py
              tests/e2e/test_onboarding_embedded_real.py
              tests/e2e/test_onboarding_wizard.py
          - group: scenarios
            paths: >-
              tests/e2e/test_news_risk.py
              tests/e2e/test_production_mount.py
              tests/e2e/test_r01_dialog_height.py
              tests/e2e/test_sidecar_real_smoke.py
    # 拆分前单 job 串行耗时 >45 分钟（run 30183636080 在 45 分钟 timeout 被取消）；
    # 2026-10-30 run 41034661213 实测 4 组 wall clock 分别 4.6 / 10.6 / 5.2 / 6.9 分钟，
    # 故上限收紧到 30 分钟（最慢组余量 ~19 分钟 / ~65%），避免异常挂起长期占用 runner。
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # 禁用 setup-uv 自带缓存：其 post-job 会对 D:\a\_temp\setup-uv-cache 执行
          # `uv cache prune --ci --force`，与下方 actions/cache 管理的 UV_CACHE_DIR 重复，
          # 且缓存目录被清理时 post-job 会报 "Cache path ... does not exist on disk"。
          # 改由下方 "Cache uv build cache" 显式缓存 UV_CACHE_DIR（D: 盘），
          # 命中后 llama-cpp-python 等 cp314 源码构建产物直接复用，免去每次重新构建。
          enable-cache: false

      - name: Cache uv build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: D:\tmp\uv-cache
          key: uv-windows-py314-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-windows-py314-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt
          # Pre-install flet-web to prevent the Flet runtime from auto-installing it at app startup.
          # Without this, 4 xdist workers concurrently pip install flet-web to the same
          # site-packages, triggering Windows file lock errors (WinError 32 / Permission denied)
          # and causing workers to crash in setup phase (root cause of run 29655213301).
          # Constrain fastapi<0.145: flet-web 1.0.5 passes the removed `openapi_prefix` to
          # FastAPI.__init__; fastapi 0.145.0+ crashes Flet Web startup. See
          # docs/flet/upgrade-checklist.md section 1.1.
          uv pip install --system flet-web==1.0.5 "fastapi<0.145"
          pip install playwright pytest-playwright

      - name: Get Playwright Version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium

      # Phase 2 方案 B（spec.md §3 不变量 1）：E2E Tests (Windows) 改用 embedded 模式，
      # 与生产代码默认值一致。构建真实 sidecar binary，让 Flet 子进程启动 sidecar +
      # 真实 PG 16，替代原有的外置 PostgreSQL service。
      # 参考 embedded-tests job 的 sidecar 构建步骤（行 675-705）。
      # sidecar 产物缓存（按 sidecar 源码哈希取键）：源码未变时直接复用 main 已构建的二进制，
      # 省掉每腿 ~1 分钟的 cargo 重建。注意 Swatinem/rust-cache 的 target 缓存无法省这一步——
      # checkout 会重写源文件 mtime，cargo 指纹判定失效后仍全量重编译（实测 run 41140196653
      # 的 Build sidecar binary 每腿 0.77~1.12 分钟，5 腿共约 5 分钟挂在 PR 关键路径上）。
      # 只缓存二进制本体（数十 MB），不缓存 target 目录；仅 main 保存，避免 PR/tag 各存一份
      # 挤占 10 GB 缓存预算（与上方 rust-cache 的 save-if 治理策略一致）。缓存命中的二进制内嵌
      # build.rs 采集的 SIDECAR_BUILD_TIME / SIDECAR_GIT_SHA 仅为诊断信息，无测试断言其与 HEAD 一致。
      - name: Restore sidecar binary (source-hash cache)
        id: cache-sidecar
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: sidecars/qtrading-pg-sidecar/target/release/qtrading-pg-sidecar.exe
          key: sidecar-bin-${{ runner.os }}-${{ hashFiles('sidecars/qtrading-pg-sidecar/Cargo.toml', 'sidecars/qtrading-pg-sidecar/Cargo.lock', 'sidecars/qtrading-pg-sidecar/build.rs', 'sidecars/qtrading-pg-sidecar/src/**', 'sidecars/qtrading-pg-sidecar/.cargo/config.toml') }}-rust1.97.1

      - name: Install Rust toolchain (1.97.1)
        if: steps.cache-sidecar.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo registry & target
        if: steps.cache-sidecar.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: sidecars/qtrading-pg-sidecar
          key: e2e-tests-windows-${{ hashFiles('sidecars/qtrading-pg-sidecar/.cargo/config.toml') }}
          # 缓存预算治理：仅 main 保存 cargo 缓存。仓库缓存上限 10 GB，非 main 引用
          # （PR/tag）各存一份 ~673 MB 的 target 目录副本，超限后按 LRU 挤掉 main 的条目，
          # 导致下次运行冷构建。非 main 运行仍可经默认分支回退读取 main 的缓存。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build sidecar binary from source
        if: steps.cache-sidecar.outputs.cache-hit != 'true'
        shell: bash
        env:
          # postgresql_embedded build script 通过 GitHub API 下载 PostgreSQL binaries 清单，
          # 未认证请求 60 次/小时/IP，传入 GITHUB_TOKEN 提升至 5000 次/小时（对齐 embedded-tests job）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecars/qtrading-pg-sidecar
          cargo build --release
          BINARY_PATH="target/release/qtrading-pg-sidecar.exe"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: sidecar binary not found at $BINARY_PATH after cargo build"
            exit 1
          fi

      # 只落盘缓存、不改变后续步骤的执行路径；若其它腿已占用同一键则 actions/cache 仅告警不失败。
      - name: Save sidecar binary (main only)
        if: steps.cache-sidecar.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: sidecars/qtrading-pg-sidecar/target/release/qtrading-pg-sidecar.exe
          key: ${{ steps.cache-sidecar.outputs.cache-primary-key }}

      # 缓存命中与现场构建共用同一导出逻辑，避免两条路径的 env 计算漂移。
      - name: Export sidecar path & sha256
        shell: bash
        run: |
          BINARY_PATH="sidecars/qtrading-pg-sidecar/target/release/qtrading-pg-sidecar.exe"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: sidecar binary not found at $BINARY_PATH (cache restore and build both failed)"
            exit 1
          fi
          ABSOLUTE_PATH="$(pwd)/$BINARY_PATH"
          echo "SIDECAR_BINARY_PATH=$ABSOLUTE_PATH" >> $GITHUB_ENV
          # 计算 sha256 供 ensure_sidecar_sha256_file 写入 .sha256 文件（覆盖真实校验路径）
          HASH=$(sha256sum "$BINARY_PATH" | awk '{print $1}')
          echo "SIDECAR_SHA256=$HASH" >> $GITHUB_ENV
          echo "Sidecar binary ready: $ABSOLUTE_PATH (sha256: $HASH)"

      - name: Run E2E Tests
        env:
          # spec.md §3 不变量 1：embedded 模式为默认，与生产代码默认值一致。
          # Flet 子进程启动 sidecar + 真实 PG 16，E2E 主进程通过 QTRADING_EMBEDDED_PG_URL_FILE
          # 获取 sidecar URL 播种数据（conftest.py 的 flet_app/seed_e2e_data fixture 协同）。
          QTRADING_DATABASE_MODE: embedded
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
          E2E_ARTIFACT_DIR: "e2e-artifacts"
          E2E_TIMEOUT_MULTIPLIER: "2.0"
          # Redirect temp dirs to D: drive (146GB free) to prevent C: exhaustion.
          TEMP: D:\tmp
          TMP: D:\tmp
          TMPDIR: D:\tmp
        shell: bash
        run: |
          mkdir -p D:/tmp
          # Run E2E tests serially with real-time logging.
          # -o addopts="" 清空 pyproject.toml 的 addopts="-n auto --dist=loadgroup"，
          # 避免 -p no:xdist 禁用插件后 -n/--dist 参数因无插件处理而报 "unrecognized arguments"。
          # -p no:xdist -p no:randomly 完全禁用并行/随机插件，串行执行让 log_cli 实时输出。
          # log_cli=true --capture=no 实时输出测试日志，便于定位卡死位置。
          # pytest-timeout=600s 防止单测试卡死拖垮整个 job。
          python -m pytest ${{ matrix.paths }} \
            -o addopts="" \
            -p no:xdist -p no:randomly \
            -v --tb=long --junitxml=junit-e2e.xml \
            --timeout=600 --timeout-method=thread \
            --durations=30 --durations-min=1.0 \
            -o log_cli=true --log-cli-level=INFO --capture=no

      - name: Sanitize E2E artifacts
        if: always()
        shell: pwsh
        run: |
          # R9: 脱敏所有可能含 DB 连接串（含密码）的文本工件，覆盖 .log 和 junit XML
          $pattern = '([a-zA-Z0-9\+\.-]+)://([^:@\s]+):[^@\s]+@'
          $replacement = '$1://$2:***@'
          foreach ($filePath in @("logs/e2e-flet-app.log", "junit-e2e.xml")) {
            if (Test-Path $filePath) {
              (Get-Content $filePath) -replace $pattern, $replacement | Set-Content $filePath -Encoding UTF8
            }
          }

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-e2e-windows-${{ matrix.group }}
          path: |
            junit-e2e.xml
            e2e-artifacts/
            logs/e2e-flet-app.log
          retention-days: 14

  ci-checks-windows:
    name: Code Quality & Unit Tests (Windows)
    needs: [lint-fast, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      UV_CACHE_DIR: D:\tmp\uv-cache
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # 同 e2e-tests-windows：保留禁用 setup-uv 自带缓存（其 post-job prune 与磁盘清理
          # 步骤冲突，曾报 "Cache path ... does not exist on disk"）；改用下方 actions/cache
          # 显式缓存 UV_CACHE_DIR（D: 盘），复用 llama-cpp-python/litellm 构建产物。
          enable-cache: false

      - name: Cache uv build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: D:\tmp\uv-cache
          key: uv-windows-py314-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-windows-py314-

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt

      - name: Free disk space
        shell: pwsh
        run: |
          # Clean caches to release space used by build artifacts and temp files.
          # Run 29998695955 failed because runner disk filled up during coverage report output.
          # Run 30058650851 failed at 87% tests with "not enough space on disk" on C: drive
          #   (C: had 32GB free, runner diagnostic logs + temp files filled it in ~8min).
          # D: drive has ~146GB free — redirect temp dirs there to avoid C: exhaustion.
          Write-Host "=== Disk space before cleanup ==="
          Get-PSDrive -Name C, D -ErrorAction SilentlyContinue | Format-Table Name, @{L='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{L='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

          # 1. uv 缓存已重定向到 D:\tmp\uv-cache 并由 actions/cache 复用，此处不再清理
          #    （清理会使缓存失效，post-job 保存落空）。

          # 2. pip cache (downloaded wheels)
          pip cache purge 2>$null

          # 3. Windows temp files (accumulated from prior steps/runs)
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue

          # 4. Windows Update cache (large on GitHub-hosted Windows runners)
          Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue

          # 5. Recycle Bin
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue

          Write-Host "=== Disk space after cleanup ==="
          Get-PSDrive -Name C, D -ErrorAction SilentlyContinue | Format-Table Name, @{L='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{L='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

      - name: Cache pytest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: pytest-${{ runner.os }}-

      - name: Run Unit Tests
        env:
          STRICT_SCHEMA_GATE: "1"
          # Redirect temp dirs to D: drive (146GB free) to prevent C: (32GB free) exhaustion.
          # Runner diagnostic logs + test temp files filled C: at 87% in run 30058650851.
          TEMP: D:\tmp
          TMP: D:\tmp
          TMPDIR: D:\tmp
        # Windows 单测实际运行时间：main 分支最近成功 run #1004（2026-07-25）821s（13 分 41 秒），
        # main 分支 run #999（2026-07-25 04:48）已实际触发 15 分钟 timeout（909s，failure），
        # PR #291 触发的 Windows 单测运行 911s（15 分 11 秒）同样触发 timeout。
        # 原 15 分钟余量仅 79s（~9%），Windows runner 性能波动 + 测试增量易突破。
        # 提升至 20 分钟留 ~6.5 分钟余量（~32%），长期优化见 P3-Windows-Unit-Test-Timeout-Tight。
        #
        # 覆盖率口径：不再追加 --cov*（实测 run 41117055568 该 job 的 Run Unit Tests 7m26 是
        # 全流水线最长分支，而 Windows 上的 coverage 采集是纯重复开销）。覆盖率门禁（per-file
        # ≥80% 强制 / 分层 advisory / diff coverage strict 80% / Codecov 上传）由 Linux
        # ci-checks job 覆盖同一批 tests/unit/ 用例并强制执行，Windows 只负责「Windows 环境
        # 下用例能否跑通」这一独有信号。
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p D:/tmp
          python -m pytest tests/unit/ -v --tb=short --junitxml=junit-unit.xml

      - name: Validate installer smoke test scripts syntax (Phase 5)
        shell: pwsh
        run: |
          # Phase 5 评审 Product Required: smoke test 脚本正确性需经 CI 回归验证
          # P5-6 决定脚本手动执行（需管理员权限），CI 至少验证 PowerShell 语法可解析
          $scripts = @(
            "scripts/installer_smoke_upgrade.ps1",
            "scripts/installer_smoke_uninstall.ps1",
            "scripts/installer_smoke_crash_recovery.ps1",
            "scripts/installer_smoke_running_app.ps1"
          )
          $hasError = $false
          foreach ($script in $scripts) {
            if (-not (Test-Path $script)) {
              Write-Error "Smoke test script not found: $script"
              $hasError = $true
              continue
            }
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Syntax error in ${script}:"
              $errors | ForEach-Object { Write-Host "  $($_.Message) at line $($_.Extent.StartLineNumber)" }
              $hasError = $true
            } else {
              Write-Host "  [OK] $script"
            }
          }
          if ($hasError) { exit 1 }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-${{ runner.os }}
          # Windows 侧不再生成 coverage.xml/json（覆盖率由 Linux ci-checks 产出），此处只传 junit。
          path: |
            junit-*.xml
          retention-days: 14

  embedded-tests:
    name: Embedded PG Tests (${{ matrix.os }})
    needs: [lint-fast, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    # uv 构建缓存重定向到 D:（Windows 上 146GB，避免占用 C:），由下方 actions/cache 显式
    # 缓存（对齐全仓 e2e-tests-windows / ci-checks-windows 的已验证方案：命中后
    # llama-cpp-python 等 cp314 源码构建产物直接复用，Install dependencies 由 5.5~9.0 分钟
    # 降至 0.7 分钟，实测 run 41026737415 / 41024657959）。
    env:
      UV_CACHE_DIR: ${{ matrix.uv_cache_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            binary_name: qtrading-pg-sidecar
            uv_cache_dir: /tmp/uv-cache
          - os: windows
            runner: windows-latest
            binary_name: qtrading-pg-sidecar.exe
            uv_cache_dir: D:\tmp\uv-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # 禁用 setup-uv 自带缓存：其 cache 依赖 glob 默认绑定 uv.lock（本项目无该文件），
          # 实测命中后 Install dependencies 仍需 5.5~9.0 分钟；改由下方 actions/cache
          # 以 requirements 哈希为键显式缓存 UV_CACHE_DIR（对齐全仓已验证方案）。
          enable-cache: false

      - name: Cache uv build cache (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: D:\tmp\uv-cache
          key: uv-windows-py314-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-windows-py314-

      # Linux 侧同源缓存：此前仅 Windows 分支做了显式缓存，linux 腿每次重下 ~300 MB wheel
      # （实测 run 41034285982 的 Install dependencies 3m23s）。键按 OS 区分，避免跨平台
      # wheel 与构建产物互相污染。
      - name: Cache uv build cache (Linux)
        if: matrix.os == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/uv-cache
          key: uv-linux-py314-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-linux-py314-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt
          # Pre-install flet-web to prevent the Flet runtime from auto-installing it at app startup.
          # Without this, E2E tests on Linux fail because Flet tries to pip install flet-web
          # at runtime into a system Python without a venv, causing:
          #   "error: No virtual environment found; run `uv venv` to create an environment"
          # and "OSError: [Errno 2] No such file or directory: '.../flet_web/web/flutter.js.map'"
          # (root cause of Embedded PG Tests (linux) failure in run 30110045876).
          # Same fix as the e2e-tests job (see line 322-326).
          # Constrain fastapi<0.145: flet-web 1.0.5 passes the removed `openapi_prefix` to
          # FastAPI.__init__; fastapi 0.145.0+ crashes Flet Web startup. See
          # docs/flet/upgrade-checklist.md section 1.1.
          uv pip install --system flet-web==1.0.5 "fastapi<0.145"

      - name: Install Rust toolchain (1.97.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: sidecars/qtrading-pg-sidecar
          key: embedded-tests-${{ matrix.os }}-${{ hashFiles('sidecars/qtrading-pg-sidecar/.cargo/config.toml') }}
          # 同 e2e-tests-windows：只允许 main 保存，避免 PR 引用各存一份 target 副本挤占 10 GB 预算
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build sidecar binary from source
        shell: bash
        env:
          # postgresql_embedded build script 通过 GitHub API 下载 PostgreSQL binaries 清单，
          # 未认证请求 60 次/小时/IP，传入 GITHUB_TOKEN 提升至 5000 次/小时（对齐 sidecar.yml）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecars/qtrading-pg-sidecar
          cargo build --release
          BINARY_PATH="target/release/${{ matrix.binary_name }}"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: sidecar binary not found at $BINARY_PATH after cargo build"
            exit 1
          fi
          ABSOLUTE_PATH="$(pwd)/$BINARY_PATH"
          echo "SIDECAR_BINARY_PATH=$ABSOLUTE_PATH" >> $GITHUB_ENV
          # 计算 sha256 供 ensure_sidecar_sha256_file 写入 .sha256 文件（覆盖真实校验路径）
          HASH=$(sha256sum "$BINARY_PATH" | awk '{print $1}')
          echo "SIDECAR_SHA256=$HASH" >> $GITHUB_ENV
          echo "Sidecar binary built: $ABSOLUTE_PATH (sha256: $HASH)"

      - name: Run integration tests (serial, -n 1 avoids sidecar concurrency)
        env:
          QTRADING_DATABASE_MODE: embedded
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
        shell: bash
        run: |
          python -m pytest \
            tests/integration/test_embedded_postgres_real_sidecar.py \
            tests/integration/test_embedded_pg_migration_regression.py \
            tests/integration/test_embedded_pg_dao_rw.py \
            tests/integration/test_embedded_pg_bootstrap.py \
            -v --tb=short -n 1 -p no:randomly --timeout=600 --timeout-method=thread

      - name: Get Playwright Version (Linux only, for E2E)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          PLAYWRIGHT_VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers (Linux only, for E2E)
        if: matrix.os == 'linux'
        id: cache-playwright-embedded
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright chromium (Linux only, for E2E)
        if: matrix.os == 'linux' && steps.cache-playwright-embedded.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run E2E tests (Linux only; Windows skipif via @pytest.mark.skipif in test file)
        if: matrix.os == 'linux'
        env:
          QTRADING_DATABASE_MODE: embedded
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
          # 与 e2e-tests job (Windows) 对齐：CI 高负载 + 多 sidecar 并发启动时
          # CanvasKit 首帧渲染可能超过默认 8000ms (TIMEOUTS.INTERACTION)，
          # 倍率 2.0 → 16000ms，避免 wizard_welcome_guide 等 expect_text 误超时
          # (PR #357 CI run 30426103862 复现根因)。
          E2E_TIMEOUT_MULTIPLIER: "2.0"
        shell: bash
        # -o addopts="" -p no:xdist 串行执行：清空 pyproject.toml 的 addopts="-n auto --dist=loadgroup"
        # 并禁用 xdist，避免用例跨 worker 并发启动多个 Flet sidecar 进程，_free_port() 探测后的
        # 释放-再绑定窗口内端口竞态导致 bind 失败（Linux errno 98，CI run 35553853143 复现）。
        # 与 e2e-tests job (Windows) 的 e2e 串行策略一致。
        run: |
          python -m pytest \
            -o addopts="" -p no:xdist -p no:randomly \
            tests/e2e/test_onboarding_embedded_real.py \
            -v --tb=short --timeout=600 --timeout-method=thread

      - name: Run E2E smoke subset (Linux only, review07 G16)
        # review07 G16 平台盲区补充：Linux PR 此前仅跑 1 个 E2E 文件，44 个用例主路径
        # 只在 Windows 验证。复用本 job 已构建的真实 sidecar（embedded 模式）追加
        # 启动/导航/基础交互 smoke 用例，覆盖 Windows 之外的主路径渲染。
        # 用例均已在 Windows 全量 E2E（PR 阻断门禁）长期通过，平台无关。
        if: matrix.os == 'linux'
        env:
          QTRADING_DATABASE_MODE: embedded
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
          E2E_TIMEOUT_MULTIPLIER: "2.0"
        shell: bash
        # 串行执行（同上方 Run E2E tests 步骤）：禁用 xdist 并发，避免多 sidecar 进程
        # 并发启动时 _free_port() 释放-再绑定窗口内端口竞态（Linux errno 98）导致进程退出。
        run: |
          python -m pytest \
            -o addopts="" -p no:xdist -p no:randomly \
            tests/e2e/test_smoke.py::test_app_boots_and_shows_nav \
            tests/e2e/test_navigation.py::test_switch_to_settings \
            tests/e2e/test_navigation.py::test_switch_to_screener \
            tests/e2e/test_home_flow.py::test_home_view_loads \
            tests/e2e/test_screener_anchor_smoke.py::test_screener_anchor_dom_present \
            tests/e2e/test_screener_anchor_smoke.py::test_screener_anchor_click_strategy_dropdown_opens \
            -v --tb=short --timeout=600 --timeout-method=thread

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: embedded-test-reports-${{ matrix.os }}
          path: |
            logs/e2e-flet-app.log
          retention-days: 7
          if-no-files-found: ignore

  windows-skip-revalidation:
    # Windows E2E skipif 复验 job：临时取消 8 个 Windows skipif 用例的 skipif，
    # 在 windows-latest runner 实机运行以判断 Flet 0.86.x 下问题是否仍存在.
    # 拆分为 3 个并行 matrix group 解决 timeout + 隔离卡死用例：
    #   - no-sidecar (4 用例): 3 fake sidecar + 1 wizard，无需 Rust 构建（wizard 仅 3s 失败不影响）
    #   - real-sidecar (3 用例): 真实 sidecar binary，需 Rust 构建链路
    #   - settings-slow (1 用例): test_settings_log_level_switch 单独跑（已知 34min 卡死，独立 60min timeout）
    # 触发：workflow_dispatch（手动触发复验，Task 2.5-2.7）.
    # 不加入 build-windows needs 列表（advisory，非 release 门禁）.
    name: Windows Skip Revalidation (${{ matrix.group }})
    needs: lint-fast
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: no-sidecar
            # 4 用例：3 fake sidecar (test_onboarding_embedded.py) + 1 wizard
            # wizard 用例使用 external DB (wizard_page fixture)，3s 快速失败不影响其他用例
            test_targets: >-
              tests/e2e/test_onboarding_embedded.py
              tests/e2e/test_onboarding_wizard.py::test_wizard_db_validation_success
            needs_rust: 'false'
            timeout_minutes: 30
          - group: real-sidecar
            # 3 用例：test_onboarding_embedded_real.py (embedded_real_wizard_page fixture)
            test_targets: tests/e2e/test_onboarding_embedded_real.py
            needs_rust: 'true'
            timeout_minutes: 60
          - group: settings-slow
            # 1 用例：test_settings_log_level_switch（已知 34min 卡死，单独跑避免拖累其他 job）
            test_targets: tests/e2e/test_settings_flow.py::test_settings_log_level_switch
            needs_rust: 'false'
            timeout_minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify CI_PG_PASSWORD secret
        env:
          CI_PG_PASSWORD: ${{ env.CI_PG_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$CI_PG_PASSWORD" ]; then
            echo "::error::CI_PG_PASSWORD secret is not configured. Please add it in repository settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # 同 e2e-tests-windows：禁用 uv 本地缓存避免 post-job 报错
          enable-cache: false

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt
          # Pre-install flet-web 防止 Flet 启动时并发 pip install 触发 Windows 文件锁
          # Constrain fastapi<0.145: flet-web 1.0.5 passes the removed `openapi_prefix` to
          # FastAPI.__init__; fastapi 0.145.0+ crashes Flet Web startup. See
          # docs/flet/upgrade-checklist.md section 1.1.
          uv pip install --system flet-web==1.0.5 "fastapi<0.145"
          pip install playwright pytest-playwright

      - name: Free disk space
        shell: pwsh
        run: |
          Write-Host "=== Disk space before cleanup ==="
          Get-PSDrive -Name C, D -ErrorAction SilentlyContinue | Format-Table Name, @{L='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{L='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
          uv cache clean
          pip cache purge 2>$null
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          Write-Host "=== Disk space after cleanup ==="
          Get-PSDrive -Name C, D -ErrorAction SilentlyContinue | Format-Table Name, @{L='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{L='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

      - name: Get Playwright Version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: cache-playwright-skip-revalidation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright chromium
        if: steps.cache-playwright-skip-revalidation.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Rust toolchain (1.97.1, real-sidecar group only)
        if: matrix.needs_rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo registry & target (real-sidecar group only)
        if: matrix.needs_rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: sidecars/qtrading-pg-sidecar
          key: windows-skip-revalidation-real-sidecar-${{ hashFiles('sidecars/qtrading-pg-sidecar/.cargo/config.toml') }}
          # 同 e2e-tests-windows：只允许 main 保存（该 job 目前仅 workflow_dispatch 触发）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build sidecar binary (real-sidecar group only)
        if: matrix.needs_rust == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecars/qtrading-pg-sidecar
          cargo build --release
          BINARY_PATH="target/release/qtrading-pg-sidecar.exe"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: sidecar binary not found at $BINARY_PATH after cargo build"
            exit 1
          fi
          ABSOLUTE_PATH="$(pwd)/$BINARY_PATH"
          echo "SIDECAR_BINARY_PATH=$ABSOLUTE_PATH" >> $GITHUB_ENV
          HASH=$(sha256sum "$BINARY_PATH" | awk '{print $1}')
          echo "SIDECAR_SHA256=$HASH" >> $GITHUB_ENV
          echo "Sidecar binary built: $ABSOLUTE_PATH (sha256: $HASH)"

      - name: Start PostgreSQL Service (Windows)
        shell: pwsh
        run: |
          $service = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue
          if (-not $service) {
            $service = Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "postgresql*" }
          }
          if ($service) {
            Set-Service -Name $service.Name -StartupType Automatic
            Start-Service $service.Name
            Write-Host "Successfully started PostgreSQL service: $($service.Name)"
          } else {
            Write-Error "PostgreSQL service not found on this Windows Runner."
            exit 1
          }

      - name: Initialize PostgreSQL Database and Password
        shell: pwsh
        run: |
          $pgBin = Get-ChildItem -Path "C:\Program Files\PostgreSQL" -Recurse -Filter "createdb.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($pgBin) {
            $env:Path += ";$pgBin"
            Write-Host "PostgreSQL bin path: $pgBin"

            for ($i=1; $i -le 15; $i++) {
              $ready = & pg_isready -h localhost -p 5432 -U postgres
              if ($ready -like "*accepting connections*") {
                Write-Host "PostgreSQL is accepting connections."
                break
              }
              Start-Sleep -Seconds 1
            }

            $newPwd = "${{ env.CI_PG_PASSWORD }}"
            $sql = "ALTER USER postgres WITH PASSWORD '$newPwd';"
            $sqlFile = [System.IO.Path]::GetTempFileName()
            Set-Content -Path $sqlFile -Value $sql -Encoding utf8 -NoNewline

            $env:PGPASSWORD = "root"
            & psql -h localhost -p 5432 -U postgres -d postgres -f $sqlFile
            $exitCode1 = $LASTEXITCODE
            Remove-Item $sqlFile -ErrorAction SilentlyContinue

            if ($exitCode1 -ne 0) {
              Write-Host "Failed with password 'root', trying with empty password..."
              $env:PGPASSWORD = ""
              $sqlFile = [System.IO.Path]::GetTempFileName()
              Set-Content -Path $sqlFile -Value $sql -Encoding utf8 -NoNewline
              & psql -h localhost -p 5432 -U postgres -d postgres -f $sqlFile
              $exitCode2 = $LASTEXITCODE
              Remove-Item $sqlFile -ErrorAction SilentlyContinue
              if ($exitCode2 -ne 0) {
                Write-Error "Failed to update postgres user password."
                exit 1
              }
            }

            $env:PGPASSWORD = $newPwd
            & dropdb -h localhost -p 5432 -U postgres test_astock --if-exists
            & createdb -h localhost -p 5432 -U postgres test_astock
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create test_astock database."
              exit 1
            }
            Write-Host "Successfully initialized database and password."
          } else {
            Write-Error "PostgreSQL binaries not found."
            exit 1
          }

      - name: Setup database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ env.CI_PG_PASSWORD }}@localhost:5432/test_astock
        run: python -m alembic upgrade head

      - name: Run Windows skip revalidation (--run-windows-skip)
        env:
          E2E_TEST_DB: 1
          DATABASE_URL: postgresql+asyncpg://postgres:${{ env.CI_PG_PASSWORD }}@localhost:5432/test_astock
          E2E_ARTIFACT_DIR: "e2e-artifacts"
          E2E_TIMEOUT_MULTIPLIER: "2.0"
          # real-sidecar group 需 sidecar binary 环境变量
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
          # Redirect temp dirs to D: drive 防止 C: 磁盘耗尽
          TEMP: D:\tmp
          TMP: D:\tmp
          TMPDIR: D:\tmp
        shell: bash
        run: |
          mkdir -p D:/tmp
          # --run-windows-skip: 临时取消 skipif markers（由 tests/e2e/_windows_skip.py 实现）
          # -n 1: 串行运行避免 PostgreSQL 连接竞争（同 e2e-tests-windows 策略）
          python -m pytest ${{ matrix.test_targets }} \
            --run-windows-skip \
            -n 1 -v --tb=long --junitxml=junit-skip-revalidation-${{ matrix.group }}.xml

      - name: Sanitize E2E artifacts
        if: always()
        shell: pwsh
        run: |
          # R9: 脱敏所有可能含 DB 连接串（含密码）的文本工件
          $pattern = '([a-zA-Z0-9\+\.-]+)://([^:@\s]+):[^@\s]+@'
          $replacement = '$1://$2:***@'
          foreach ($filePath in @("logs/e2e-flet-app.log", "junit-skip-revalidation-${{ matrix.group }}.xml")) {
            if (Test-Path $filePath) {
              (Get-Content $filePath) -replace $pattern, $replacement | Set-Content $filePath -Encoding UTF8
            }
          }

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-skip-revalidation-${{ matrix.group }}
          path: |
            junit-skip-revalidation-${{ matrix.group }}.xml
            e2e-artifacts/
            logs/e2e-flet-app.log
          retention-days: 30

  e2e-sidecar-real-smoke:
    # P3-E2E-Sidecar-Ready-Path: 真实 sidecar smoke E2E，验证 ready → migration → 主界面渲染路径。
    # 仅 release tag 触发（非 PR 必跑门禁），避免 PR 阶段 sidecar 构建 + PG initdb 拖慢 CI。
    # 失败时上传 sidecar stdout/stderr 日志 + Python 解析日志（e2e-flet-app.log）为 artifact。
    name: E2E Sidecar Real Smoke (release tags only)
    needs: lint-fast
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt
          # Constrain fastapi<0.145: flet-web 1.0.5 passes the removed `openapi_prefix` to
          # FastAPI.__init__; fastapi 0.145.0+ crashes Flet Web startup. See
          # docs/flet/upgrade-checklist.md section 1.1.
          uv pip install --system flet-web==1.0.5 "fastapi<0.145"
          pip install playwright pytest-playwright

      - name: Free disk space
        shell: pwsh
        run: |
          Write-Host "=== Disk space before cleanup ==="
          Get-PSDrive -Name C, D -ErrorAction SilentlyContinue | Format-Table Name, @{L='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{L='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
          uv cache clean
          pip cache purge 2>$null
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          Write-Host "=== Disk space after cleanup ==="
          Get-PSDrive -Name C, D -ErrorAction SilentlyContinue | Format-Table Name, @{L='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{L='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

      - name: Get Playwright Version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: cache-playwright-smoke
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright chromium
        if: steps.cache-playwright-smoke.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Rust toolchain (1.97.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: sidecars/qtrading-pg-sidecar
          key: e2e-sidecar-real-smoke-${{ hashFiles('sidecars/qtrading-pg-sidecar/.cargo/config.toml') }}
          # 同 e2e-tests-windows：只允许 main 保存（该 job 仅发版 tag 触发，避免每次发版新增副本）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build sidecar binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sidecars/qtrading-pg-sidecar
          cargo build --release
          BINARY_PATH="target/release/qtrading-pg-sidecar.exe"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "ERROR: sidecar binary not found at $BINARY_PATH after cargo build"
            exit 1
          fi
          ABSOLUTE_PATH="$(pwd)/$BINARY_PATH"
          echo "SIDECAR_BINARY_PATH=$ABSOLUTE_PATH" >> $GITHUB_ENV
          HASH=$(sha256sum "$BINARY_PATH" | awk '{print $1}')
          echo "SIDECAR_SHA256=$HASH" >> $GITHUB_ENV
          echo "Sidecar binary built: $ABSOLUTE_PATH (sha256: $HASH)"

      - name: Run E2E sidecar real smoke test
        env:
          QTRADING_DATABASE_MODE: embedded
          SIDECAR_BINARY_PATH: ${{ env.SIDECAR_BINARY_PATH }}
          SIDECAR_SHA256: ${{ env.SIDECAR_SHA256 }}
          E2E_ARTIFACT_DIR: "e2e-artifacts"
          E2E_TIMEOUT_MULTIPLIER: "2.0"
          TEMP: D:\tmp
          TMP: D:\tmp
          TMPDIR: D:\tmp
        shell: bash
        run: |
          mkdir -p D:/tmp
          python -m pytest tests/e2e/test_sidecar_real_smoke.py \
            -v --tb=long --timeout=600 --timeout-method=thread \
            --junitxml=junit-sidecar-smoke.xml

      - name: Collect sidecar logs
        if: always()
        shell: bash
        run: |
          # P3-E2E-Sidecar-Ready-Path: best-effort 收集 sidecar stdout/stderr 日志用于诊断
          # sidecar 日志位于 embedded_pg_data_root 的兄弟目录 postgres-logs/ 下
          mkdir -p sidecar-logs
          find "D:/tmp" -type f \( \
            -name "sidecar.stdout.log" -o \
            -name "sidecar.stderr.log" -o \
            -name "embedded-pg-service.log" \
          \) -exec cp {} sidecar-logs/ \; 2>/dev/null || true
          echo "Collected sidecar logs:"
          ls -la sidecar-logs/ 2>/dev/null || echo "(no sidecar logs found)"

      - name: Sanitize E2E artifacts
        if: always()
        shell: pwsh
        run: |
          # R9: 脱敏所有可能含 DB 连接串（含密码）的文本工件
          $pattern = '([a-zA-Z0-9\+\.-]+)://([^:@\s]+):[^@\s]+@'
          $replacement = '$1://$2:***@'
          foreach ($filePath in @("logs/e2e-flet-app.log", "junit-sidecar-smoke.xml")) {
            if (Test-Path $filePath) {
              (Get-Content $filePath) -replace $pattern, $replacement | Set-Content $filePath -Encoding UTF8
            }
          }

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-sidecar-real-smoke-reports
          path: |
            junit-sidecar-smoke.xml
            e2e-artifacts/
            logs/e2e-flet-app.log
            sidecar-logs/
          retention-days: 30
          if-no-files-found: ignore

  requirements-drift:
    name: Detect requirements drift
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.check-drift.outputs.drift }}
    # PR 事件仅对代码类变更运行；push main / 手动触发保持全量（依赖漂移与改动范围无关）。
    if: (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Recompile requirements
        shell: bash
        run: |
          uv pip compile --universal --no-emit-index-url pyproject.toml -o requirements.txt
          uv pip compile --universal --no-emit-index-url --extra dev pyproject.toml -o requirements-dev.txt
          uv pip compile --universal --no-emit-index-url --extra optional pyproject.toml -o requirements-optional.txt

      - name: Check for drift
        id: check-drift
        shell: bash
        run: |
          if git diff --exit-code requirements.txt requirements-dev.txt requirements-optional.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No requirements drift detected."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::requirements*.txt drift detected. An update PR will be created."
          fi

  update-requirements:
    name: Update requirements*.txt
    needs: requirements-drift
    # Dependabot 发起的 PR 与普通 fork PR 均不被注入 PAT_FOR_CI secret（GitHub Actions 平台安全限制）。
    # 本 job 还依赖 contents: write / pull-requests: write 回推分支，而 fork PR 的 GITHUB_TOKEN 被降级为只读，
    # 故两种触发下既无 secret 也无写权限，若运行会因 token 为空 / 推送被拒而失败（skip 而非失真绿灯）。
    # 因此保留 drift=true 前置条件不变，仅在事件维度补 fork 守卫：fork PR 由维护者在库分支重跑该流程。
    if: needs.requirements-drift.outputs.drift == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Recompile requirements
        shell: bash
        run: |
          uv pip compile --universal --no-emit-index-url pyproject.toml -o requirements.txt
          uv pip compile --universal --no-emit-index-url --extra dev pyproject.toml -o requirements-dev.txt
          uv pip compile --universal --no-emit-index-url --extra optional pyproject.toml -o requirements-optional.txt

      - name: Create PR for requirements update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.PAT_FOR_CI }}
          branch: chore/auto-requirements-sync
          title: "chore: sync requirements*.txt"
          body: |
            Auto-generated by CI after Windows `uv pip compile` drift detection.
            
            Please review changes and merge if appropriate.
            
            ## What changed
            - requirements.txt
            - requirements-dev.txt
            - requirements-optional.txt
          commit-message: "chore: update requirements*.txt via uv pip compile"
          delete-branch: true
          labels: dependencies, auto

  build-windows:
    name: Build Windows EXE (${{ matrix.variant }})
    needs: [ci-checks, ci-checks-static, ci-checks-db, ci-checks-windows, e2e-tests-windows, embedded-tests]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # 锁定 windows-2022（VS 2022）：windows-latest 已滚动迁移到 VS 2026（GitHub 2026-05 公告），
    # 而 CUDA 12.4 nvcc 仅支持 MSVC 192x/193x（VS 2019/2022），在 VS 2026 上 CMake 报
    # "No CUDA toolset found."，llama-cpp-python CUDA 后端源码编译失败（B03 随之误报
    # ModuleNotFoundError）。升级 CUDA Toolkit 版本且确认其支持新镜像 VS 版本后才可解除锁定。
    runs-on: windows-2022
    # CUDA 变体需 ~40 分钟源码编译 llama-cpp-python（CPU 变体走缓存），叠加 CUDA Toolkit
    # 安装耗时波动（实测 12.4 安装单次可达 26 分钟）后 60 分钟会超时取消
    # （run 40902860461 的 embedded-cuda 即在 60 分钟整点被取消），故放宽到 120 分钟。
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # 4 个发布变体：cpu / cuda 为独立安装包（外置 PostgreSQL 模式），embedded-cpu / embedded-cuda
      # 额外内置 sidecar PostgreSQL。llama-cpp-python 是编译型原生扩展，PyPI 0.3.x 仅发源码包，
      # 各后端在 CI 构建期通过 cmake args 编译（CMAKE_ARGS="-DGGML_CUDA=on" → CUDA，不设则 CPU）。
      # abetlen 预编译 wheel 已无法匹配项目的 Python 3.14 + llama-cpp-python 0.3.36 组合
      # （abl wheel 最高支持 Python 3.12 + llama-cpp-python 0.3.4），故 v0.3.35 起切换到
      # 源码编译路径。因此每个 EXE 只能运行单一后端，需按后端拆分发行。
      # embedded 标记供 if: 条件区分内嵌。
      matrix:
        include:
          - variant: cpu
            backend: cpu
            embedded: "false"
          - variant: cuda
            backend: cuda
            embedded: "false"
          - variant: embedded-cpu
            backend: cpu
            embedded: "true"
          - variant: embedded-cuda
            backend: cuda
            embedded: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install CUDA Toolkit (CUDA variants only)
        if: matrix.backend == 'cuda'
        # windows-2022 镜像自 20261025 起移除 WinGet（Package Management 仅剩 Chocolatey），
        # 原 `winget install Nvidia.CUDA` 步骤报 "The term 'winget' is not recognized"。
        # 改用 Jimver/cuda-toolkit：直接下载 NVIDIA 官方 network installer，并按 sub-packages
        # 生成 `-s <子包>_<主>.<次> ... -n` 参数（与原 `--override` 等价，跳过 Display.Driver：
        # CUDA installer 默认带 driver，在 Windows runner 上装 driver 会触发重启/蓝屏）。
        # 子包名须与 CUDA 12.4 安装指南 Table 2 一致（NVRTC 为 nvrtc/nvrtc_dev，无 "cuda_" 前缀；
        # 传入无效子包名会使 installer 整体失败 0xE0E00019）。
        # 版本选 12.4（非 12.1）：MSVC 19.40+ 自带的 STL 在 yvals_core.h 中硬断言 CUDA >= 12.4
        # （`error STL1002: Unexpected compiler version, expected CUDA 12.4 or newer.`），
        # 而 windows-2022 镜像只带 VS 2022 14.44（MSVC 19.44），12.1/12.3 的 CUDA 编译必然失败
        # （该断言属 MSVC STL 自身，nvcc 的 -allow-unsupported-compiler 无法绕过）。
        # 12.4 是 CUDA 12.x minor version compatibility 区间内满足该断言的最低版本，不抬高用户驱动门槛。
        # 另须装 visual_studio_integration（NVIDIA 的 VS 集成子包，action 会自动补 `_12.4` 后缀）：
        # scikit-build-core 在 runner 上使用 "Visual Studio 17 2022" 生成器，CMake 经 MSBuild 查找
        # CMAKE_VS_PLATFORM_TOOLSET_CUDA，缺该集成时 CMakeDetermineCompilerId 直接报
        # "No CUDA toolset found."（nvcc 存在且 `nvcc --version` 正常并不代表 VS 集成已装齐）。
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d  # v0.2.36
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'
          use-github-cache: false

      - name: Verify CUDA Toolkit (CUDA variants only)
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # CUDA 默认装到 C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin"
          if (-not (Test-Path (Join-Path $cudaBin "nvcc.exe"))) {
            # 失败时 dump NVIDIA installer 日志便于定位（静默安装失败默认无输出）
            Get-ChildItem "$env:ProgramData\NVIDIA Corporation" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "----- $($_.FullName) -----"; Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue }
            Write-Error "CUDA Toolkit 12.4 (nvcc.exe) not found at $cudaBin after install"
            exit 1
          }
          & (Join-Path $cudaBin "nvcc.exe") --version

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # B03: llama-cpp-python 0.3.x 在 PyPI 仅发源码包，本地 C++ 编译器已就绪（windows-latest
          # 自带 VS Build Tools），直接源码编译。CUDA 变体额外注入 CMAKE_ARGS="-DGGML_CUDA=on"
          # 使 nvcc 编译 CUDA 后端；CPU 变体不设 CMAKE_ARGS，cmake 自动只编 CPU。
          # abetlen 预编译 wheel 已无法匹配 Python 3.14 + llama-cpp-python 0.3.36
          # （abl wheel 最高 cp312 + 0.3.4），故 v0.3.35 起切换到此源码编译路径。
          if ("${{ matrix.backend }}" -eq "cuda") {
            # CUDA 12.4 的 nvcc 官方白名单仍是 MSVC 193x，而 windows-2022 镜像只带 VS 2022 14.44（cl 19.44，
            # MSVC 1944），nvcc 的 host_config.h 在编译期硬性 #error 拒绝该版本，故显式放行
            # （NVIDIA 称 use at your own risk）。注意：此放行只越过 nvcc 的 host compiler 白名单，
            # MSVC STL 的 "expected CUDA 12.4 or newer"（STL1002）由上面的 CUDA 12.4 版本满足。
            $env:CMAKE_ARGS = "-DGGML_CUDA=on -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler"
            # 安装步骤只把 CUDA 目录写进 GITHUB_PATH / 系统 PATH，当前 shell 可能未刷新；显式追加确保 cmake 找到 nvcc
            $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin"
            if (Test-Path $cudaBin) {
              $env:Path = "$cudaBin;$env:Path"
            }
            Write-Host "CMAKE_ARGS=$env:CMAKE_ARGS"
            nvcc --version
            # uv 的构建缓存（setup-uv 从 GitHub Actions cache 恢复，键只取 requirements 哈希）
            # 不区分 CMAKE_ARGS：CUDA 变体会直接复用 CPU 变体编出的 llama-cpp-python wheel，
            # lib 下没有 *cuda*.dll（B03 校验失败），且 CUDA wheel 反向写回也会污染 CPU 变体。
            # 故为 CUDA 变体指向独立缓存目录，强制从 sdist 重新编译且不写回共享缓存。
            $env:UV_CACHE_DIR = "$env:UV_CACHE_DIR-cuda"
          }
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system pyinstaller==6.19.0


      - name: Verify llama-cpp-python CUDA backend DLLs (CUDA variants only)
        if: contains(matrix.variant, 'cuda')
        # 不能用 `import llama_cpp` 做断言：CUDA 版 llama.dll 在 import 期即被 ctypes 加载，
        # runner 上没有 CUDA 运行时（cudart64_12.dll / cublas64_12.dll 需用户本机安装），
        # 会抛 "Could not find module ... llama.dll (or one of its dependencies)"，
        # 使断言在检查 lib 目录前就失败（run 40888569612 即如此，此时 CUDA 编译实际已成功）。
        # 故改用 find_spec 只解析包目录，并打印 lib 全部 DLL 作为证据。
        # 断言按语义而非文件名：llama-cpp-python 的 llama.cpp 版本可能把 CUDA 后端静态链进
        # llama.dll（此时 lib 下无 *cuda*.dll），故同时接受「lib 下有 *cuda*.dll」或
        # 「llama.dll 的导入表引用 cudart64_12/cublas64_12/cublasLt64_12」两种形态。
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgDir = python -c "import importlib.util; print(importlib.util.find_spec('llama_cpp').submodule_search_locations[0])"
          Write-Host "llama_cpp package dir: $pkgDir"
          $libDir = Join-Path $pkgDir "lib"
          Get-ChildItem $libDir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          $cudaDlls = @(Get-ChildItem $libDir -Filter "*cuda*.dll")
          Write-Host "Found CUDA DLLs: $($cudaDlls.Name -join ',')"
          $linked = $false
          $llamaDll = Join-Path $libDir "llama.dll"
          if (Test-Path $llamaDll) {
            $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($llamaDll))
            $linked = $ascii.Contains("cudart64_12.dll") -or $ascii.Contains("cublas64_12.dll") -or $ascii.Contains("cublasLt64_12.dll")
            Write-Host "llama.dll references CUDA runtime DLLs: $linked"
          }
          if ($cudaDlls.Count -eq 0 -and -not $linked) {
            Write-Error "B03: no CUDA backend evidence in $libDir for variant ${{ matrix.variant }} (no *cuda*.dll and llama.dll does not import CUDA runtime)!"
            exit 1
          }

      - name: Download sidecar binary (embedded variants only, Phase 5)
        if: matrix.embedded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Downloading sidecar binary from latest sidecar-v* release..."
          # --exclude-drafts --exclude-pre-releases 确保取到最新稳定版（评审 Architecture Required: 版本排序稳定性）
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --exclude-drafts --exclude-pre-releases | Where-Object { $_ -match "sidecar-v" }
          if ($LASTEXITCODE -ne 0 -or -not $releases) {
            Write-Error "No sidecar-v* stable release found. Please create sidecar-v* tag and run sidecar.yml release job first. (gh exit: $LASTEXITCODE)"
            exit 1
          }
          $latestLine = $releases | Select-Object -First 1
          $tagName = ($latestLine -split "`t")[0]
          Write-Host "Latest sidecar release: $tagName"
          # AStockScreener.spec 期望 sidecar binary 位于 sidecars\qtrading-pg-sidecar\target\release\
          $targetDir = "sidecars\qtrading-pg-sidecar\target\release"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          # 下载 binary + sha256sums-x86_64-pc-windows-msvc.txt（评审 Security Required: 供应链完整性校验）
          # sidecar.yml release job 上传 artifact_name（每平台唯一，避免 basename 冲突），
          # Windows 平台 artifact_name 为 qtrading-pg-sidecar-windows-x86_64.exe，
          # 下载后 rename 回 qtrading-pg-sidecar.exe（AStockScreener.spec 期望的 binary 名）
          $sha256sumsFileName = "sha256sums-x86_64-pc-windows-msvc.txt"
          $artifactName = "qtrading-pg-sidecar-windows-x86_64.exe"
          $expectedBinaryName = "qtrading-pg-sidecar.exe"
          gh release download $tagName `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $artifactName `
            --pattern $sha256sumsFileName `
            --dir $targetDir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gh release download failed (exit: $LASTEXITCODE)"
            exit 1
          }
          $downloadedPath = Join-Path $targetDir $artifactName
          $sidecarPath = Join-Path $targetDir $expectedBinaryName
          # rename artifact_name -> expected binary name（spec 期望名）
          Move-Item -Path $downloadedPath -Destination $sidecarPath -Force
          $sha256Path = Join-Path $targetDir $sha256sumsFileName
          if (-not (Test-Path $sidecarPath)) {
            Write-Error "Sidecar binary not found at $sidecarPath after download"
            exit 1
          }
          $fileInfo = Get-Item $sidecarPath
          if ($fileInfo.Length -eq 0) {
            Write-Error "Sidecar binary is 0 bytes (corrupt download)"
            exit 1
          }
          Write-Host "Sidecar binary downloaded: $($fileInfo.Length) bytes"
          # SHA256 校验（评审 Security Required: 供应链完整性）
          if (Test-Path $sha256Path) {
            $expectedLine = (Get-Content $sha256Path -Raw).Trim()
            $expectedHash = ($expectedLine -split "\s+")[0].ToLower()
            $actualHash = (Get-FileHash -Algorithm SHA256 $sidecarPath).Hash.ToLower()
            if ($actualHash -ne $expectedHash) {
              Write-Error "SHA256 mismatch! Expected: $expectedHash, Actual: $actualHash"
              exit 1
            }
            Write-Host "SHA256 verified: $actualHash"
          } else {
            # P1-13: sha256sums-<target>.txt 缺失视为供应链完整性失败 (Security Required)
            Write-Error "$sha256sumsFileName not found in release assets — supply chain integrity verification failed"
            exit 1
          }

      - name: Build EXE with PyInstaller
        run: pyinstaller AStockScreener.spec

      - name: "Smoke Test - Run EXE (--smoke-test)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exePath = "dist\AStockScreener\AStockScreener.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "EXE not found at $exePath"
            exit 1
          }
          Write-Host "Running smoke test on built EXE (--smoke-test)..."
          $smokeOutFile = Join-Path (Get-Location) "smoke-out.txt"
          if (Test-Path $smokeOutFile) { Remove-Item $smokeOutFile -Force }
          $env:QTRADING_SMOKE_OUTPUT_FILE = $smokeOutFile
          $proc = Start-Process -FilePath $exePath -ArgumentList "--smoke-test" -PassThru -RedirectStandardError "smoke-err.txt"
          $timeout = 30
          $elapsed = 0
          while (-not $proc.HasExited -and $elapsed -lt $timeout) {
            Start-Sleep -Milliseconds 500
            $elapsed += 0.5
          }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Error "B04: EXE --smoke-test timed out after ${timeout}s (did not exit cleanly)"
            exit 1
          }
          $exitCode = $proc.ExitCode
          if ($exitCode -ne 0) {
            Write-Error "EXE --smoke-test exited with non-zero code: $exitCode"
            if (Test-Path "smoke-err.txt") {
              $errOutput = Get-Content "smoke-err.txt" -Raw
              if ($errOutput -and $errOutput.Length -gt 0) {
                Write-Host "=== STDERR ==="
                Write-Host $errOutput.Substring(0, [Math]::Min(2000, $errOutput.Length))
              }
            }
            exit 1
          }
          if (-not (Test-Path $smokeOutFile)) {
            Write-Error "Smoke test failed: expected output file $smokeOutFile was not created"
            exit 1
          }
          $output = Get-Content $smokeOutFile -Raw
          if ($output -match "AStockScreener smoke check OK") {
            Write-Host "Smoke test passed: $output"
          } else {
            Write-Error "Smoke test failed: output does not contain 'AStockScreener smoke check OK' (got: $output)"
            exit 1
          }

      - name: Smoke Test - Cold Start (embedded variants, Phase 5)
        if: matrix.embedded == 'true'
        shell: pwsh
        run: |
          # Phase 5 DoD §17.5: embedded variants 冷启动 smoke test
          # 启动 EXE，轮询 60s 检查 sidecar 进程是否启动，然后优雅关闭
          $exePath = "dist\AStockScreener\AStockScreener.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "EXE not found at $exePath"
            exit 1
          }
          Write-Host "Starting embedded variants EXE for cold start smoke test..."
          $proc = Start-Process -FilePath $exePath -PassThru
          try {
            # 轮询 60s 检查 sidecar 进程
            $timeout = 60
            $elapsed = 0
            $sidecarSeen = $false
            while ($elapsed -lt $timeout) {
              $sidecar = Get-Process -Name "qtrading-pg-sidecar" -ErrorAction SilentlyContinue
              if ($sidecar) {
                $sidecarSeen = $true
                Write-Host "[$elapsed s] Sidecar process detected (PID: $($sidecar.Id -join ','))"
                break
              }
              Start-Sleep -Seconds 2
              $elapsed += 2
            }
            if (-not $sidecarSeen) {
              Write-Error "Smoke test failed: sidecar process not detected within ${timeout}s"
              exit 1
            }
            Write-Host "Smoke test passed: sidecar process started within ${elapsed}s"
          } finally {
            # 优雅关闭主进程（sidecar 应由 Job Object 自动退出）
            if ($proc -and -not $proc.HasExited) {
              Write-Host "Stopping main EXE process (PID: $($proc.Id))..."
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
            }
            # 清理残留 sidecar 进程
            $residual = Get-Process -Name "qtrading-pg-sidecar" -ErrorAction SilentlyContinue
            if ($residual) {
              Write-Host "Cleaning up residual sidecar process..."
              Stop-Process -Name "qtrading-pg-sidecar" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DMyAppVersion=${{ github.ref_name }} /DTargetVariant=${{ matrix.variant }}

      - name: Smoke Test - Verify Installer Exists
        shell: pwsh
        run: |
          $installerPath = "Output\AStockScreener-Setup-${{ matrix.variant }}.exe"
          if (Test-Path $installerPath) {
            Write-Host "✅ Installer created successfully: $installerPath"
            $fileInfo = Get-Item $installerPath
            Write-Host "   Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          } else {
            Write-Host "🔍 Diagnostics: Listing all .exe files in workspace to troubleshoot..."
            Get-ChildItem -Path . -Filter *.exe -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            Write-Error "❌ Installer not found: $installerPath"
            exit 1
          }

      - name: Smoke Test - Installer Scripts (embedded variants, release tags only, P1-12)
        # P1-12: installer smoke 脚本需真实安装应用到 %LOCALAPPDATA%,
        # 仅在 release tag 时执行避免常规 PR/push 污染 CI 环境.
        # installer.iss PrivilegesRequired=lowest → user-level 安装, 无需管理员权限.
        if: matrix.embedded == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installerPath = "Output\AStockScreener-Setup-${{ matrix.variant }}.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer not found: $installerPath"
            exit 1
          }
          Write-Host "Running installer smoke tests (crash_recovery + running_app, P1-12)..."
          # 子脚本以 powershell 5.1 运行, 其非 0 退出不会抛异常; 必须显式校验
          # $LASTEXITCODE, 否则前一个脚本失败会被后一个脚本的 0 退出码覆盖.
          & powershell -File scripts/installer_smoke_crash_recovery.ps1 -InstallerPath $installerPath
          $crashRecoveryExitCode = $LASTEXITCODE
          if ($crashRecoveryExitCode -ne 0) {
            Write-Error "installer_smoke_crash_recovery.ps1 failed with exit code $crashRecoveryExitCode"
            exit $crashRecoveryExitCode
          }
          Write-Host "✅ installer_smoke_crash_recovery.ps1 passed"
          & powershell -File scripts/installer_smoke_running_app.ps1 -InstallerPath $installerPath
          $runningAppExitCode = $LASTEXITCODE
          if ($runningAppExitCode -ne 0) {
            Write-Error "installer_smoke_running_app.ps1 failed with exit code $runningAppExitCode"
            exit $runningAppExitCode
          }
          Write-Host "✅ installer_smoke_running_app.ps1 passed"

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          # 输出到 Output\ 而非仓库根：upload-artifact 对多路径以共同祖先为基准打包，
          # 三个文件同在 Output\ 下时解包后才是平铺结构（release-windows 依赖平铺路径）。
          Get-FileHash -Algorithm SHA256 Output\AStockScreener-Setup-${{ matrix.variant }}.exe | Format-List > Output\SHA256SUMS-${{ matrix.variant }}.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: Output/sbom-${{ matrix.variant }}.cdx.json
          # 同 ci-checks job：禁用 release asset 上传避免 contents: write 权限冲突。
          # 本 job 的 SBOM 已通过下方 "Upload Release Assets (tag only)" 步骤纳入
          # release-assets-${{ matrix.variant }} artifact，由 release-windows job 统一上传。
          upload-release-assets: false

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: Output/AStockScreener-Setup-${{ matrix.variant }}.exe

      - name: Upload Build Artifact (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: AStockScreener-Setup-${{ github.ref_name }}-windows-${{ matrix.variant }}
          path: Output/AStockScreener-Setup-${{ matrix.variant }}.exe
          retention-days: 7

      - name: Upload Release Assets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-assets-${{ matrix.variant }}
          # 三者统一取自 Output\，保证 artifact 解包后与 release-windows 的
          # release-assets/release-assets-<variant>/<file> 平铺路径一致。
          path: |
            Output/AStockScreener-Setup-${{ matrix.variant }}.exe
            Output/SHA256SUMS-${{ matrix.variant }}.txt
            Output/sbom-${{ matrix.variant }}.cdx.json
          retention-days: 3

  release-windows:
    name: Create GitHub Release
    # 发布必须同时等待 release-only 的真实 sidecar smoke（SUP-CI-002）：该 job 失败时
    # 本 job 因 needs 未全成功而跳过，避免“同次 workflow 红色但 Release 已发布”。
    # e2e-sidecar-real-smoke 与 build-windows 在 tag 场景均会执行；workflow_dispatch
    # 非 tag ref 下 smoke 被 skip，而本 job 的 if 同为 tag-only，同样跳过，不会误发布。
    needs: [build-windows, e2e-sidecar-real-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: release-assets-*
          merge-multiple: false
          path: release-assets

      - name: Verify downloaded release assets (before any Release is created)
        shell: bash
        run: |
          set -euo pipefail
          # 原子发布第 1 步：先校验 build-windows 上传的 4 个变体资产，全部通过才创建/更新
          # draft Release。校验失败时尚未产生任何 Release 对象，最坏结果是「什么都没发生」。
          variants=(cpu cuda embedded-cpu embedded-cuda)
          for variant in "${variants[@]}"; do
            dir="release-assets/release-assets-${variant}"
            installer="AStockScreener-Setup-${variant}.exe"
            sums="SHA256SUMS-${variant}.txt"
            sbom="sbom-${variant}.cdx.json"
            if [ ! -d "$dir" ]; then
              echo "::error::missing artifact directory: $dir"
              exit 1
            fi
            # 每个变体必须恰好 3 个文件（安装包 / SHA256SUMS / SBOM），多一个少一个都失败，
            # 避免把残留或多余文件带进 draft。
            expected=$(printf '%s\n' "$installer" "$sums" "$sbom" | sort)
            actual=$(find "$dir" -maxdepth 1 -type f -printf '%f\n' | sort)
            if [ "$actual" != "$expected" ]; then
              echo "::error::unexpected asset set in $dir"
              echo "expected: $(printf '%s\n' "$expected" | paste -sd ',' -)"
              echo "actual:   $(printf '%s\n' "$actual" | paste -sd ',' -)"
              exit 1
            fi
            for file in "$installer" "$sums" "$sbom"; do
              if [ ! -s "${dir}/${file}" ]; then
                echo "::error::missing or empty release asset: ${dir}/${file}"
                exit 1
              fi
            done
            # SHA256SUMS 由 build-windows 用 PowerShell `Get-FileHash | Format-List` 生成
            # （Algorithm/Hash/Path 三行），不是 `sha256sum -c` 可解析的「<hash>  <file>」格式，
            # 故提取唯一 64 位十六进制摘要后与本地实测摘要比对。
            mapfile -t digests < <(grep -oE '[0-9A-Fa-f]{64}' "${dir}/${sums}" || true)
            if [ "${#digests[@]}" -ne 1 ]; then
              echo "::error::${sums} must contain exactly one SHA256 digest (found ${#digests[@]})"
              exit 1
            fi
            recorded="${digests[0],,}"
            if ! grep -qF "$installer" "${dir}/${sums}"; then
              echo "::error::${sums} does not reference ${installer}"
              exit 1
            fi
            computed=$(sha256sum "${dir}/${installer}" | awk '{print $1}')
            if [ "$computed" != "$recorded" ]; then
              echo "::error::SHA256 mismatch for ${installer}: recorded=${recorded} computed=${computed}"
              exit 1
            fi
          done
          echo "All 4 variants verified: 12 assets present, installer SHA256 matches each SHA256SUMS."

      - name: Check release state and tag lock (fail-closed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 原子发布第 2 步（幂等策略）：
          #   - 同 tag 已有 draft：复用，后续覆盖同名资产并重新校验（用于失败重跑恢复）；
          #   - 同 tag 已有正式 Release：直接失败，不改写、不重发（已发布资产的摘要可能
          #     已被外部引用，静默替换会让既有下载/校验记录与页面资产不一致），需人工
          #     评估后显式删除；不采用「先 gh release delete 再重建」的破坏性做法；
          #   - 无 Release：稍后新建 draft。
          # 同时确认远端 tag 存在，锁定本次 Release 的 tag 来源就是触发本次运行的 tag，
          # 避免 target_commitish 默认值把 Release 建到别的 ref 上。
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.ref' >/dev/null; then
            echo "::error::remote tag ${TAG} not found; refusing to create a release from a different ref."
            exit 1
          fi
          # draft 无法用 /releases/tags/{tag} 查询（未发布的 draft 其 tag ref 尚未创建，
          # 该端点固定返回 404），故按 tag_name 从 Releases 列表定位 id 后再按 id 判定状态。
          release_id=$(gh api "repos/${GH_REPO}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")][0].id // empty")
          if [ -n "$release_id" ]; then
            if [ "$(gh api "repos/${GH_REPO}/releases/${release_id}" --jq '.draft')" != "true" ]; then
              echo "::error::release ${TAG} is already published; refusing to overwrite a published release."
              echo "::error::if replacement is truly intended, delete it manually first, then re-run."
              exit 1
            fi
            echo "Existing draft release for ${TAG} found (id=${release_id}); it will be reused and its assets re-verified."
          else
            echo "No release exists for ${TAG}; a new draft will be created."
          fi

      - name: Create or reuse draft Release (assets uploaded, still unpublished)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # draft 对外不可见（仅写权限可见）、不能被标记 latest；失败时留下的只是这个
          # draft，不会被外部当作正式版本。同名资产由 overwrite_files 覆盖（重跑恢复）。
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/release-assets-cpu/*
            release-assets/release-assets-cuda/*
            release-assets/release-assets-embedded-cpu/*
            release-assets/release-assets-embedded-cuda/*

      - name: Verify draft assets and SHA256 digests (gate before publish)
        id: verify-draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 原子发布第 3 步：以 GitHub API 返回的 draft 为准再验一次（防止上传阶段
          # 少传/错传/被同名旧资产顶替），全部通过才允许 publish。`digest` 是服务端
          # 对落盘字节计算的 SHA256（格式 `sha256:<hex>`），与本地文件实测摘要一致才
          # 说明上传内容未被改变。
          # draft 不能用 /releases/tags/{tag} 查询（未发布的 draft 其 tag ref 尚未创建，
          # 该端点固定返回 404；run 41013466172 即因此失败：12 个资产已正确上传，
          # 却卡在按 tag 查询）。改为按 tag_name 从 Releases 列表定位 id，再按 id 读取。
          release_id=$(gh api "repos/${GH_REPO}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")][0].id // empty")
          if [ -z "$release_id" ]; then
            echo "::error::no release found for ${TAG}; refusing to continue."
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          release_json=$(gh api "repos/${GH_REPO}/releases/${release_id}")
          if [ "$(jq -r '.draft' <<<"$release_json")" != "true" ]; then
            echo "::error::release ${TAG} is not a draft at verification time; refusing to continue."
            exit 1
          fi
          actual_tag=$(jq -r '.tag_name' <<<"$release_json")
          if [ "$actual_tag" != "$TAG" ]; then
            echo "::error::release tag ${actual_tag} does not match ${TAG}."
            exit 1
          fi
          variants=(cpu cuda embedded-cpu embedded-cuda)
          expected_names=()
          for variant in "${variants[@]}"; do
            expected_names+=(
              "AStockScreener-Setup-${variant}.exe"
              "SHA256SUMS-${variant}.txt"
              "sbom-${variant}.cdx.json"
            )
          done
          expected=$(printf '%s\n' "${expected_names[@]}" | sort)
          actual=$(jq -r '.assets[].name' <<<"$release_json" | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::draft asset set mismatch (expected 12 assets for 4 variants)"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          for variant in "${variants[@]}"; do
            for file in \
              "AStockScreener-Setup-${variant}.exe" \
              "SHA256SUMS-${variant}.txt" \
              "sbom-${variant}.cdx.json"; do
              remote_digest=$(jq -r --arg name "$file" \
                '.assets[] | select(.name == $name) | .digest // ""' <<<"$release_json")
              if [ -z "$remote_digest" ]; then
                echo "::error::asset ${file} has no server-side digest; cannot verify integrity."
                exit 1
              fi
              local_digest="sha256:$(sha256sum "release-assets/release-assets-${variant}/${file}" | awk '{print $1}')"
              if [ "$remote_digest" != "$local_digest" ]; then
                echo "::error::digest mismatch for ${file}: remote=${remote_digest} local=${local_digest}"
                exit 1
              fi
            done
          done
          echo "Draft ${TAG} verified: 12 assets, tag matches, every digest matches the local bytes."

      - name: Publish draft Release as latest (verification passed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.verify-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          # 原子发布第 4 步：一次 PATCH 完成 draft=false + make_latest=true（draft 与
          # prerelease 均不能标记 latest，故 latest 必须在发布动作内生效）。按 id 定位
          # （draft 无法经 tags 端点查询），因此复用 verify 步骤解析出的 release_id。
          # 请求不含 body，generate_release_notes 生成的正文不会被改写。命令失败时
          # Release 仍是 draft，外部仍不会把它当作正式版本。
          if [ -z "${RELEASE_ID:-}" ]; then
            echo "::error::release id not available from verify step; cannot publish."
            exit 1
          fi
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -f draft=false -f make_latest=true >/dev/null

  installer-smoke:
    # P3-CI-Installer-Smoke-Trigger + P3-CI-Installer-PowerShell-Syntax-Only 合并解决：
    # PR 阶段验证 installer.iss 的 ISCC 编译通过性，避免缺陷延迟到 release tag 阶段才暴露。
    # 顶层 pull_request 已不设 paths 过滤（required check 要求 workflow 必触发），
    # 代码类判定由 changes job 完成；此处再按 PR 事件 + 代码类变更做二次过滤，
    # job 内部仍有 fail-closed 的「Detect installer changes」步骤：仅当 PR 修改 installer.iss
    # 或 scripts/*installer* 时跑 ISCC 编译。
    # 不生成 release artifact（不接入 actions/upload-artifact），仅验证编译通过。
    name: Installer ISCC Smoke Test
    needs: [lint-fast, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect installer changes
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # 二次精准过滤：仅当 PR 修改 installer.iss 或 scripts/*installer* 时跑 ISCC
          # 避免 scripts/ 下非 installer 脚本修改触发无意义 ISCC 编译
          #
          # 分页：gh api --paginate 跟随 Link: rel="next" 读取全部 PR 变更文件（每页 per_page=100），
          # --jq 按页应用于每个 JSON 数组；不使用 --slurp（会变成页数组的数组，与 .[].filename 不匹配）。
          # 失败语义（fail-closed）：token 缺失 / API 非 2xx / 响应解析失败都必须显式失败，
          # 不得回落为 skip=true（否则 ISCC 校验会被静默跳过）。
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::PR_NUMBER is empty; cannot list PR files."
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty; cannot list PR files."
            exit 1
          fi
          if ! FILES=$(gh api --paginate --jq '.[].filename' \
            "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100"); then
            echo "::error::failed to list PR files (gh api exited non-zero); refusing to skip ISCC smoke."
            exit 1
          fi
          FILE_COUNT=0
          if [ -n "$FILES" ]; then
            FILE_COUNT=$(printf '%s\n' "$FILES" | wc -l | tr -d '[:space:]')
          fi
          # GitHub 的 PR files 接口最多返回 3000 个文件；触达上限时无法保证检测完整，按失败处理。
          if [ "$FILE_COUNT" -ge 3000 ]; then
            echo "::error::PR file list reached the GitHub API cap (3000); installer detection may be incomplete."
            exit 1
          fi
          # 用 here-string 而非管道传入 grep，避免 pipefail 下 grep 提前退出触发 SIGPIPE 误判。
          if grep -Eq '^installer\.iss$|^scripts/.*installer.*' <<< "$FILES"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Installer-related changes detected."
            grep -E '^installer\.iss$|^scripts/.*installer.*' <<< "$FILES"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No installer-related changes, skipping ISCC smoke."
          fi

      - name: Install Inno Setup
        if: steps.detect.outputs.skip == 'false'
        run: choco install innosetup -y

      - name: Create minimal stub layout
        if: steps.detect.outputs.skip == 'false'
        shell: pwsh
        run: |
          # installer.iss [Files] 段引用 dist\AStockScreener\* (主程序产物)
          # PR smoke 阶段不跑 PyInstaller (耗时长)，创建最小 stub 让 ISCC 能扫描通过
          # 验证 installer.iss 语法正确性，不生成有效 release artifact
          New-Item -ItemType Directory -Force -Path "dist\AStockScreener\_internal\sidecars" | Out-Null
          New-Item -ItemType File -Force -Path "dist\AStockScreener\AStockScreener.exe" | Out-Null
          New-Item -ItemType File -Force -Path "dist\AStockScreener\_internal\sidecars\qtrading-pg-sidecar.exe" | Out-Null
          Write-Host "Stub layout created for ISCC compile (TargetVariant=cpu and embedded-cpu)"

      - name: Compile Installer with Inno Setup (smoke)
        if: steps.detect.outputs.skip == 'false'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DMyAppVersion=0.0.0-smoke /DTargetVariant=cpu && "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DMyAppVersion=0.0.0-smoke /DTargetVariant=embedded-cpu

      - name: Verify Installer Compiled
        if: steps.detect.outputs.skip == 'false'
        shell: pwsh
        run: |
          foreach ($v in @("cpu", "embedded-cpu")) {
            $installerPath = "Output\AStockScreener-Setup-$v.exe"
            if (Test-Path $installerPath) {
              Write-Host "ISCC smoke test passed for variant ${v}: $installerPath"
            } else {
              Write-Error "ISCC smoke test failed: installer not found at $installerPath"
              exit 1
            }
          }


  flaky-detection:
    name: Flaky Test Detection (advisory)
    runs-on: ubuntu-latest
    # 默认 10 轮完整 tests/unit/（约 1.5 万用例）实测需 23~33 分钟，
    # 30 分钟预算在常规 runner 上会中途超时被取消，放宽至 45 分钟留足余量。
    timeout-minutes: 45
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt

      - name: Detect flaky tests (advisory)
        run: python scripts/detect_flaky.py

  # 聚合门禁：main 分支的 required status check（与 docs-ci.yml 的 Docs Consistency Check 并列）。
  # 独立的聚合 job 而非直接 required 各矩阵 job 的原因：
  #   ① 矩阵 job 改名会让 required check 永久停在 Pending（自锁）；
  #   ② needs 链上游失败会让下游 skipped，而 skipped 在 required check 中视为通过，
  #      直接 required 单个 job 会形成「上游失败 → 下游 skipped → 门禁绿灯」的假门禁。
  # 本 job 用 needs.*.result 显式校验，只放行明确允许的跳过。
  ci-gate:
    name: CI Gate
    needs: [changes, lint-fast, ci-checks, ci-checks-static, ci-checks-db, ci-checks-windows, e2e-tests-windows, embedded-tests, installer-smoke]
    # merge_group 一并覆盖：工作流已声明 merge_group 触发，若只在本 job 限定 pull_request，
    # 启用 merge queue 后 merge group commit 上不会产生 CI Gate，required check 将永久 Pending。
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Evaluate required jobs
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint-fast.result }}
          LINUX: ${{ needs.ci-checks.result }}
          STATIC: ${{ needs.ci-checks-static.result }}
          DB: ${{ needs.ci-checks-db.result }}
          WINDOWS: ${{ needs.ci-checks-windows.result }}
          E2E: ${{ needs.e2e-tests-windows.result }}
          EMBEDDED: ${{ needs.embedded-tests.result }}
          INSTALLER: ${{ needs.installer-smoke.result }}
        run: |
          set -euo pipefail
          fail=0
          {
            echo "## CI Gate"
            echo ""
            echo "变更分类 \`code=${CODE:-unknown}\`，actor \`${ACTOR}\`，fork PR \`${IS_FORK:-false}\`"
            echo ""
            echo "| job | result | 判定 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          check_required() {
            local name="$1" result="$2" allow_skipped="$3"
            if [ "$result" = "success" ]; then
              echo "| $name | $result | ok |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$result" = "skipped" ] && [ "$allow_skipped" = "true" ]; then
              echo "| $name | $result | ok（允许跳过） |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | $result | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          }

          # 分类与稳定基线 lint 对任何 PR 都必须真正执行成功。
          check_required "Changes" "$CHANGES" false
          check_required "Fast Lint Check (3.14)" "$LINT" false

          if [ "$CODE" = "false" ]; then
            # 非代码类 PR：重型 job 按设计跳过，允许 skipped；出现 failure 仍判不通过。
            check_required "Code Quality & Tests (Linux)" "$LINUX" true
            check_required "Code Quality (Linux, static)" "$STATIC" true
            check_required "DB Migration Checks (Linux)" "$DB" true
            check_required "Code Quality & Unit Tests (Windows)" "$WINDOWS" true
            check_required "E2E Tests (Windows)" "$E2E" true
            check_required "Embedded PG Tests" "$EMBEDDED" true
            check_required "Installer ISCC Smoke Test" "$INSTALLER" true
          else
            # 代码类 PR：Linux 套件只有在 dependabot 或 fork PR（无 secrets，平台限制）时才允许跳过，
            # 其余平台必须真实通过。
            linux_allow_skipped=false
            if [ "$ACTOR" = "dependabot[bot]" ] || [ "$IS_FORK" = "true" ]; then
              linux_allow_skipped=true
            fi
            check_required "Code Quality & Tests (Linux)" "$LINUX" "$linux_allow_skipped"
            # 静态/DB 各自独立上报：跳过条件与 ci-checks 一致，故同样按 dependabot/fork 放行。
            check_required "Code Quality (Linux, static)" "$STATIC" "$linux_allow_skipped"
            check_required "DB Migration Checks (Linux)" "$DB" "$linux_allow_skipped"
            check_required "Code Quality & Unit Tests (Windows)" "$WINDOWS" false
            check_required "E2E Tests (Windows)" "$E2E" false
            check_required "Embedded PG Tests" "$EMBEDDED" false
            # installer-smoke 仅 installer 相关变更才实际执行，job 内已有 fail-closed 的变更检测。
            check_required "Installer ISCC Smoke Test" "$INSTALLER" true
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**CI Gate 不通过**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI Gate 不通过：存在失败或非预期跳过的 job（详见 step summary）"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**CI Gate 通过**" >> "$GITHUB_STEP_SUMMARY"

