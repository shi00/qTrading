name: Docs Consistency CI

on:
  pull_request:
    branches: [ "main" ]
    # 不使用 paths 过滤：Docs Consistency Check 是 main 的 required status check，
    # 若 paths 未命中则本 workflow 不触发，该 check 永久停在 Pending 并阻塞合并。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    name: Docs Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # 缓存预算治理：Linux 侧 `uv pip install` 仅数秒（wheel 主要走 setup-python 的 pip
          # 缓存），而 setup-uv 自带缓存在每个 PR 引用各存一份 ~350 MB，挤占仓库 10 GB 上限。
          enable-cache: false

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt

      - name: Run docs consistency script (docs-consistency hook 等价检查)
        run: python scripts/check_docs_consistency.py

      - name: Run docs consistency contract tests
        run: python -m pytest tests/unit/test_docs_consistency.py -v --tb=short