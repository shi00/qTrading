name: Docs Consistency CI

on:
  pull_request:
    branches: [ "main" ]
    # 不使用 paths 过滤：Docs Consistency Check 是 main 的 required status check，
    # 若 paths 未命中则本 workflow 不触发，该 check 永久停在 Pending 并阻塞合并。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    name: Docs Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt
            requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # 禁用 setup-uv 自带缓存：其默认缓存键绑定 uv.lock（本仓库未跟踪该文件），且每个 PR
          # 引用各存一份 ~350 MB，挤占仓库 10 GB 上限。改由下方 actions/cache 显式缓存
          # UV_CACHE_DIR（键不含 ref，main 与 PR 共用同一条目）。
          # 注：此前注释所称「Linux 侧 uv pip install 仅数秒」与实测不符——run 41037287334 的
          # Install dependencies 耗时 2m06s（每次重下 pyarrow/polars-runtime 等 ~300 MB wheel）。
          enable-cache: false

      - name: Cache uv build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/uv-cache
          key: uv-linux-py3.13-${{ hashFiles('requirements.txt', 'requirements-optional.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-linux-py3.13-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-optional.txt
          uv pip install --system -r requirements-dev.txt

      - name: Run docs consistency script (docs-consistency hook 等价检查)
        run: python scripts/check_docs_consistency.py

      - name: Run docs consistency contract tests
        run: python -m pytest tests/unit/test_docs_consistency.py -v --tb=short