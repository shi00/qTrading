[project]
name = "AStockScreener"
version = "0.10.1"
description = "智能 A 股 AI 量化交易员"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

# urllib3>=2.7.0: Fix Brotli decode error for requests; must be >= 2.6.2
# brotlicffi: Fast Brotli compression support for urllib3 (optional dep, must be explicit)
#
# Version constraint policy (DEP-M1):
# - All dependencies use >= for forward compatibility.
# - Exceptions pinned with == (breaking changes / tight coupling):
#   * flet / flet-desktop / flet-charts / flet-code-editor: UI framework with breaking layout/behavior changes across minor versions; flet-charts is the chart control package split out since V1; flet-code-editor is the code editor control package (must sync with flet main package).
#   * tushare: API methods and data formats vary between versions; client code is tightly coupled.
#   * akshare: API methods, return types, and column names vary between versions; client code calls 5+ ak.stock_* methods.
dependencies = [
    "flet==1.0.1",
    "flet-desktop==1.0.1",
    "flet-charts==1.0.1",
    "flet-code-editor==1.0.1",
    "tushare==1.4.29",
    "akshare==1.18.97",
    "requests>=2.34.0",
    "httpx>=0.28.0",
    "urllib3>=2.8.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pandas_market_calendars>=5.3.2",
    "openpyxl>=3.1.5",  # Excel export engine for pandas.DataFrame.to_excel()
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.54,<2.1",  # <2.1: 防 2.1.0 发布后 requirements-drift 自动拉到 major 破坏版本
    "alembic>=1.20.0",
    "sqlparse>=0.6.0",
    "litellm>=1.102.1",  # Upgrade to 1.102.1; 约束 openai<3.0.0,>=2.20.0（阻断 openai 3.x 越级）; Python 3.14 support (<3.15, >=3.10); aiohttp CVE-2026-47265/CVE-2026-34993 fixed via transitive dep
    "llama-cpp-python>=0.3.35",
    "apscheduler>=3.11.3",
    "tzdata>=2026.4",
    "python-dotenv>=1.2.3",
    "keyring>=25.7.0",
    "cryptography>=50.0.1",  # Security: CVE-2026-69247 (PKCS#7 Bleichenbacher oracle) fixed in 50.0.0 -> 50.0.1
    "readerwriterlock>=1.0.9",
    "cachetools>=7.2.0",
    "pydantic>=2.13.5",
    "aiohttp>=3.14.3",  # Security: CVE-2026-69244/69243/59881 fixed in 3.14.3
    "pillow>=12.3.0",  # Security: PYSEC-2026-2253~2257 (decompression bomb + shell injection) fixed in 12.3.0
    "soupsieve>=2.9.0",  # Security: CVE-2026-85999/86000 (ReDoS) fixed in 2.9.0; transitive via beautifulsoup4 (akshare/bs4)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=16.7",
    "pytest-randomly>=5.0.0",
    "pytest-benchmark>=5.0.0",  # PRF-07: 写库热路径 _prepare_records 性能定基（xdist 激活时自动禁用测量，定向 -n0 运行）
    "pytest-timeout>=2.4.0",  # Diagnose CI integration test hang (xdist worker deadlock); 2.5.0 在 PyPI 被 yanked（accidental breaking change），2.4.0 为可用最新稳定
    "pytest-json-report>=1.5.0",  # JSON report for scripts/detect_flaky.py
    "ruff>=0.16.8",  # UP-4.3 全库格式化升级：ruff 0.16 format 变更涉及全库 .py + .md，本 PR 独立消化格式 diff
    "pyright>=1.1.414",
    "pandas-stubs>=3.0.5.260914",
    "uv>=0.12.18",
    "pip-audit>=2.10.0",
    "hypothesis>=6.168.1",
    "syrupy>=6.1.1",
    "msgpack>=1.2.2",  # Security: GHSA-6v7p-g79w-8964 (Use After Free in Unpacker reuse)
    "import-linter>=2.15",  # Architecture guard: enforce R1 layered dependencies (CLAUDE.md §4.1)
    "flet-mcp==1.0.1",  # AI dev-time Flet API verification (CLAUDE.md §1.10); run via `python -c "from flet_mcp import mcp; mcp.run()"`; pinned == to align with flet main package (api.json is version-specific)
]
optional = [
    "brotlicffi>=1.2.0.2",
    "playwright>=1.63.0",  # E2E browser automation for Flet desktop tests
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "B", "SIM", "BLE", "ASYNC", "DTZ", "RUF"]
# OSS E1: select 增 ASYNC/DTZ/RUF 三族（RUF001-003 中文项目歧义 Unicode 误报过多；
# ASYNC109 与项目"显式超时参数"约定冲突，报告建议直接 ignore；
# RUF102 误伤 check_redlines.py 的项目自定义红线 noqa 协议（# noqa: R16 等，供自研检查器精确匹配））
ignore = ["E501", "E402", "SIM102", "SIM105", "SIM108", "SIM117", "BLE001", "RUF001", "RUF002", "RUF003", "ASYNC109", "RUF102"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# OSS E1: tests/ 中属于"测试常态"的存量（naive datetime 构造 fixture、解构未用变量、
# 死 noqa、集合拼接、测试内 create_task 等）按报告建议分批消化，不阻塞本次三族启用；
# 生产代码保持三族严格全开（0 命中）。
"tests/**" = ["DTZ001", "DTZ005", "DTZ007", "DTZ011", "DTZ901", "RUF059", "RUF100", "RUF012", "RUF006", "RUF005", "RUF015", "RUF009", "RUF013", "RUF022", "RUF023", "RUF046", "RUF043", "RUF007", "RUF010", "RUF034", "F401", "ASYNC110", "ASYNC230", "ASYNC240", "ASYNC251", "SIM114", "SIM115"]
"scripts/**" = ["DTZ001", "DTZ005", "DTZ011", "DTZ901", "RUF059", "RUF100", "RUF012"]
# utils/config_handler.py 是组合根 facade（re-export 供 cfg.ConfigHandler 域模块访问），
# 未使用 import 属预期模式；其余 F401 已逐一核验为测试 patch 保留 / side-effect import。
"utils/config_handler.py" = ["F401", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
log_cli = false
log_cli_level = "INFO"
log_level = "DEBUG"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:pytest_asyncio.plugin",
]
addopts = "--durations=20 --durations-min=1.0 -n auto --dist=loadgroup --timeout=300 --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests (real sleeps, heavy I/O)",
    "network: Tests requiring real network access (reserved marker, CI currently always executes)",
    "database: Tests requiring database connection",
    "migration: Tests that perform DDL (drop_all/create_all) on shared engine, should run serially",
    "ai: Tests requiring AI service",
    "no_auto_mock: Skip auto-mocking of external services in conftest",
    "mutates_config: marks tests that mutate global config (theme/language) and need restoration",
    "no_db: Tests that do not require database (skip DB schema initialization in integration autouse fixture)",
    "embedded_real: Tests requiring real Rust sidecar binary + real embedded PostgreSQL (skip if sidecar binary missing)",
    "meta: Tests for scripts/* tooling (not business logic)",
    "xdist_group(name): serial group for pytest-xdist load-balanced runs",
    "timeout_e2e_smoke: E2E smoke tests with 60s per-test timeout",
    "timeout_e2e_standard: E2E standard tests with 180s per-test timeout",
    "timeout_e2e_real: E2E real sidecar tests with 600s per-test timeout",
]

[tool.coverage.run]
branch = true
source = ["core", "data", "services", "strategies", "utils", "ui", "app", "config", "main"]
omit = [
    "data/tiktoken_cache/*",
    "scripts/*",
    "tests/*",
    # main.py 已瘦身为入口（review01-A7 拆出 app/application.py 可测模块），
    # 核心启动/关闭逻辑已由 tests/integration/test_main.py + test_main_shutdown_flow.py
    # 覆盖 app.application.run 与 app.application._prepare_db_with_retry 等。
    # NOTE(lazy): main.py 入口脚本仍 omit 覆盖率统计. ceiling: main.py 覆盖率长期 <80%.
    # upgrade: app.application.run 已可测（integration 覆盖）；若需单测 ft.run 分支再评估移除 omit.
    "main.py",
]

[tool.coverage.report]
# fail_under: 流水线整体覆盖率阈值，低于此值时 CI 失败
# 用于确保整体代码质量，防止覆盖率下降
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.custom_coverage]
# 单个文件覆盖率阈值，由 scripts/check_per_file_coverage.py 读取，不属于 coverage.py 的原生选项
# per_file_minimum 是默认阈值（未匹配 per_file_minimum_by_path 的文件）
per_file_minimum = 80
# D37: 按目录分层覆盖率门禁 (services/strategies/data ≥90%, ui ≥85%, 其他 ≥80%)
# 匹配规则：最长前缀匹配（路径归一化为 / 分隔后匹配，前缀不含前导 ./）
# NOTE(lazy): 分层门禁当前 advisory 模式 (enforce_layered=false). ceiling: services/strategies/data ≥90%, ui ≥85%. upgrade: 补齐对应目录覆盖率至分层阈值后设为 true.
enforce_layered = false

[tool.custom_coverage.per_file_minimum_by_path]
"services/" = 90
"strategies/" = 90
"data/" = 90
"ui/" = 85

[tool.importlinter]
# R1 架构越界守护 (CLAUDE.md §3.1 R1 / §4.1)
root_packages = [
    "core",
    "data",
    "services",
    "strategies",
    "ui",
    "app",
    "utils",
]
# 排除 `if TYPE_CHECKING:` 块内的导入。
# services/backtest_service.py 合法地在 TYPE_CHECKING 块中导入 strategies 层仅用于类型注解。
exclude_type_checking_imports = true

# E4 (OSS 检视): 6 条手工 forbidden 契约重构为 1 条 layers + 2 条必要 forbidden。
# layers 一次声明完整单向分层顺序（从高到低）：app(编排层) → ui → strategies → services → data → core(最内层)。
# 一个 layers 契约自动覆盖全部方向组合，新增层自动生效、不再逐个枚举，且语义不减：
#   - core 不可导入 data/services/strategies/ui/app（原契约 1 的层级部分 + §4.2）
#   - data 不可导入 services/strategies/ui/app（原契约 2 + AST 守护的 data→app 上提至 import-linter）
#   - services 不可导入 strategies/ui/app（原契约 3 + AST 守护的 services→app 上提）
#   - strategies 不可导入 ui/app（原契约 4 + AST 守护的 strategies→app 上提）
#   - ui 不可导入 app（原契约 6）
#   - app 可依赖所有层（编排层，仅被 main.py 调用）
# utils 与 app 为无法放入单向线性层序的两个特例（§4.1），故单独保留 forbidden：
#   - core 禁入 utils（下列"core 必须不导入 utils"契约；utils 可被除 core 外任意层引用，无法线性定位）
#   - utils 禁入 data/services/strategies/ui/app（下方契约5，横切叶子，含 ignore_imports 白名单）
# （注：utils 作为横切叶子本可进层序最低端，但 core 禁入 utils 与「utils 仅禁业务层、可被任意层引用」
#   的双向约束无法在同一线性序中同时表达，故拆出 forbidden。）

# 契约 1: R1 — 单向分层（core → data → services → strategies → ui → app，从高到低的层序）
[[tool.importlinter.contracts]]
name = "R1: layered dependencies (core→data→services→strategies→ui→app)"
type = "layers"
layers = ["app", "ui", "strategies", "services", "data", "core"]

# 契约 2: R1 — core 作为最内层不得反向导入 utils 横切叶子 (§4.2，utils 不在层序中故单独声明)
[[tool.importlinter.contracts]]
name = "R1: core must not import utils"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["utils"]

# 契约 3: R1 — utils 为横切叶子层，不得反向依赖任何业务层 (§3.1 R1 / §4.1)
# review01-A1：将 test_architecture_boundaries.py 中 utils 方向检查提升为 pre-commit 契约，
# 使 utils 反向依赖在提交阶段即被拦截（此前仅在 CI 全量测试阶段暴露）。
# ignore_imports 登记存量函数内 lazy import（review01-A1 取证：lint-imports 会分析函数体内
# import）。这些违规按 review01-A2/A6 计划逐个消除：方向性违规（scheduler_service →
# strategies/services）通过夜间预测下沉消除；循环打破型（config_handler ↔ db_config_service）
# 保留但必须带 # lazy-import: 注释。消除后同步移除对应 ignore 条目。
# 每条 ignore 的批准记录登记于 docs/governance/exceptions.yml（GDR-01：EX id 逐条回指，
# 该文件为 R1 架构例外唯一注册入口，见 CLAUDE.md §4.1）。
[[tool.importlinter.contracts]]
name = "R1: utils must not import business layers"
type = "forbidden"
source_modules = ["utils"]
forbidden_modules = ["data", "services", "strategies", "ui", "app"]
ignore_imports = [
    # EX-0001 config_handler ↔ db_config_service 循环打破（A2 标注 lazy-import，保留）
    # review05-E11：该 lazy import 随按域拆分迁至 utils/config/db.py
    "utils.config.db -> data.persistence.db_config_service",
    # EX-0002 diagnostics 采集时访问业务单例（A2 评估下沉到 services/diagnostics）
    "utils.diagnostics -> data.data_processor",
    # EX-0003
    "utils.diagnostics -> services.task_manager",
    # EX-0004 scheduler_service 剩余函数内 lazy import（daily/ai_concept 提交与 DB idempotency 状态，
    # 启动性能优化——模块加载不拉起 data/services 全栈；review01-A2 已加 # lazy-import: 注释）
    "utils.scheduler_service -> data.cache.cache_manager",
    # EX-0005
    "utils.scheduler_service -> data.data_processor",
    # EX-0006
    "utils.scheduler_service -> data.persistence.app_state_service",
    # EX-0019 scheduler_service 幂等键写入经 engine_provider 查引擎状态（R5 守卫，review03-C11 中立模块；
    # REVIEW-06 TO-04 修复：替代原 CacheManager._instance 直接访问；lazy-import 注释见 _persist_run_date_db）
    "utils.scheduler_service -> data.persistence.engine_provider",
    # EX-0007
    "utils.scheduler_service -> services.task_manager",
    # EX-0008 shutdown 关机步骤按需加载，避免模块加载即拉起全栈（A2 标注 lazy-import，保留）
    "utils.shutdown -> data.data_processor",
    # EX-0009
    "utils.shutdown -> data.domain_services.market_data_service",
    # EX-0010
    "utils.shutdown -> data.persistence.data_explorer_query_client",
    # EX-0011
    "utils.shutdown -> data.persistence.embedded_postgres.service",
    # EX-0012
    "utils.shutdown -> services.embedded_pg_maintenance_service",
    # EX-0013
    "utils.shutdown -> services.local_model_manager",
    # EX-0014
    "utils.shutdown -> services.news_subscription_service",
    # EX-0015
    "utils.shutdown -> services.task_manager",
    # EX-0016 (D6-1/D6-2): scheduler_service 交易日历降级到离线日历（契约 5 例外，
    # 启动补偿 + except 降级两处函数内 lazy import，见 docs/governance/exceptions.yml）
    "utils.scheduler_service -> data.domain_services.offline_calendar",
]

# qTrading embedded PostgreSQL sidecar 配置 (pg_plan §15.5 AI-12)
# 由 scripts/verify_versions.py 校验与 sidecars/qtrading-pg-sidecar/Cargo.toml 一致
[tool.qtrading.sidecar]
# sidecar 二进制版本，必须与 sidecars/qtrading-pg-sidecar/Cargo.toml [package].version 一致
version = "0.1.0"
# ready JSON schema 主版本号 (pg_plan §6.2 / §13.7.19 / D34)
# 与 sidecars/qtrading-pg-sidecar/src/protocol.rs PROTOCOL_VERSION 常量一致
# Python 端 EmbeddedPostgresService.start() 校验 ready JSON 的 schema 主版本与该值兼容
protocol_version = "v1"
# bundled PostgreSQL 归档版本 (pg_plan §15.2，固定 16 系列)
postgresql_version = "16.14.0"
# postgresql_embedded crate 版本 (Cargo.toml dependencies)
crate_version = "0.21.0"

